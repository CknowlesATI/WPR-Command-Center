name: Planning preview validation
on:
  push:
    branches:
      - feature/timeline-overhaul-preview-20261028
    paths:
      - 'worker/src/planning-contract.js'
      - 'worker/src/index.js'
      - 'worker/migrations/0010_planning_items.sql'
      - 'tools/planning-contract.test.mjs'
      - '.github/workflows/planning-preview-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker/src/index.js
      - run: node --test tools/planning-contract.test.mjs
