<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>WPR Command Center</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #202936;
    --muted: #657184;
    --border: #dfe4eb;
    --green: #18794e;
    --green-bg: #e9f7ef;
    --amber: #9b6500;
    --amber-bg: #fff4d8;
    --red: #bf2f2f;
    --red-bg: #fde9e9;
    --blue: #245fc8;
    --blue-bg: #e9f0ff;
    --shadow: 0 1px 2px rgba(17, 24, 39, .06), 0 8px 24px rgba(17, 24, 39, .06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(255, 255, 255, .96);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }

  .topbar {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) minmax(220px, 360px);
    gap: 16px;
    align-items: center;
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 22px;
  }

  h1 {
    margin: 0;
    line-height: 1.2;
  }

  .brand-reset {
    display: inline-flex;
    align-items: center;
    width: min(480px, 72vw);
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }

  .brand-reset:hover,
  .brand-reset:focus-visible {
    opacity: .86;
  }

  .brand-reset:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 3px;
    border-radius: 4px;
  }

  .brand-logo {
    display: block;
    width: 100%;
    height: auto;
  }

  .subtitle {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }

  .search {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text);
    background: #fbfcfd;
  }

  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 22px 48px;
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .updated {
    color: var(--muted);
    font-size: 12px;
  }

  .status-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .auth-button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }

  .auth-button.connected {
    border-color: #b8dec8;
    background: var(--green-bg);
    color: var(--green);
  }

  .settings-panel {
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 12px;
    box-shadow: var(--shadow);
  }

  .settings-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(260px, .7fr);
    gap: 14px;
    align-items: start;
  }

  .settings-title {
    margin: 0 0 4px;
    font-size: 14px;
    font-weight: 850;
  }

  .settings-copy {
    margin: 0 0 4px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
  }

  .recipient-list {
    display: grid;
    gap: 7px;
    margin-top: 10px;
  }

  .recipient-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    border: 1px solid #edf0f4;
    border-radius: 8px;
    background: #fbfcfd;
    padding: 8px;
  }

  .recipient-email {
    min-width: 0;
    font-size: 12px;
    font-weight: 750;
    overflow-wrap: anywhere;
  }

  .email-activity {
    display: grid;
    gap: 6px;
    margin-top: 12px;
  }

  .email-activity-row {
    border: 1px solid #edf0f4;
    border-radius: 8px;
    background: #fbfcfd;
    padding: 8px;
  }

  .email-activity-row.sent {
    border-color: #b8dec8;
    background: var(--green-bg);
  }

  .email-activity-row.failed {
    border-color: #f0b8b8;
    background: var(--red-bg);
  }

  .email-activity-title {
    font-size: 12px;
    font-weight: 800;
    overflow-wrap: anywhere;
  }

  .settings-form {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
  }

  .settings-form input {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 8px;
  }

  .pulse-sync {
    display: grid;
    gap: 8px;
    margin-top: 14px;
    border-top: 1px solid #edf0f4;
    padding-top: 12px;
  }

  .pulse-sync textarea {
    width: 100%;
    min-height: 94px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    line-height: 1.35;
    padding: 8px;
  }

  .pulse-sync-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .pulse-sync-result {
    display: grid;
    gap: 6px;
  }

  .pulse-sync-summary {
    color: var(--muted);
    font-size: 12px;
    font-weight: 750;
  }

  .pulse-sync-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    border: 1px solid #edf0f4;
    border-radius: 7px;
    background: #fbfcfd;
    padding: 7px 8px;
    font-size: 12px;
  }

  .pulse-sync-row strong {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pulse-sync-row span {
    color: var(--muted);
    font-size: 11.5px;
  }

  .pulse-sync-row.missing {
    border-color: #f3d9a3;
    background: var(--amber-bg);
  }

  .sync-banner {
    border: 1px solid #f3d9a3;
    border-radius: 8px;
    background: var(--amber-bg);
    color: var(--amber);
    padding: 9px 12px;
    font-size: 12px;
    font-weight: 650;
    margin-bottom: 14px;
  }

  .sync-banner.error {
    border-color: #f0b8b8;
    background: var(--red-bg);
    color: var(--red);
  }

  .source-freshness {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: -3px 0 14px;
  }

  .freshness-pill {
    display: grid;
    gap: 3px;
    min-width: 178px;
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: 8px;
    background: #fff;
    padding: 8px 10px;
  }

  .freshness-pill.good { border-left-color: var(--green); }
  .freshness-pill.stale { border-left-color: var(--amber); }
  .freshness-pill.failed { border-left-color: var(--red); }

  .freshness-title {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: var(--text);
    font-size: 12px;
    font-weight: 850;
  }

  .freshness-title span:last-child {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
  }

  .freshness-meta {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.3;
  }

  .edit-note {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .chip {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .chip.active {
    background: var(--text);
    border-color: var(--text);
    color: #fff;
  }

  .kpis {
    display: grid;
    grid-template-columns: repeat(5, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }

  .kpi {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    box-shadow: var(--shadow);
    text-align: left;
  }

  .kpi-button {
    width: 100%;
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }

  .kpi-button:hover,
  .kpi-button:focus-visible {
    border-color: #bac5d4;
    box-shadow: 0 12px 26px rgba(21, 32, 43, .12);
    transform: translateY(-1px);
    outline: 0;
  }

  .kpi strong {
    display: block;
    font-size: 24px;
    line-height: 1;
  }

  .kpi span {
    display: block;
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 650;
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 22px 0 10px;
  }

  .section-head h2 {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .count {
    color: var(--muted);
    font-size: 12px;
  }

  .section-title-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .attention-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .section-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .text-button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 7px;
    padding: 6px 9px;
    font-size: 12px;
    font-weight: 750;
    cursor: pointer;
  }

  .text-button:hover {
    border-color: #c9d1dc;
  }

  .attention-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--amber);
    border-radius: 8px;
    padding: 12px;
    box-shadow: var(--shadow);
  }

  .attention-card.red { border-left-color: var(--red); }
  .attention-card.green { border-left-color: var(--green); }

  .attention-label {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .03em;
  }

  .attention-title {
    margin-top: 7px;
    font-size: 14px;
    font-weight: 750;
    line-height: 1.3;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  .attention-meta {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
  }

  .project-list {
    display: grid;
    gap: 7px;
  }

  .project-template {
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 12px;
    box-shadow: var(--shadow);
  }

  .template-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 9px;
  }

  .template-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }

  .timeline-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    box-shadow: var(--shadow);
    overflow-x: auto;
  }

  .timeline-grid {
    min-width: 680px;
  }

  .timeline-row {
    display: grid;
    grid-template-columns: 170px 1fr;
    gap: 10px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #edf0f4;
  }

  .timeline-row:last-child {
    border-bottom: 0;
  }

  .timeline-months {
    display: grid;
    grid-template-columns: 170px 1fr;
    gap: 10px;
    margin-bottom: 3px;
  }

  .month-track {
    position: relative;
    height: 18px;
  }

  .month-label {
    position: absolute;
    top: 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 750;
  }

  .timeline-name {
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .timeline-track {
    position: relative;
    height: 20px;
    border-radius: 5px;
    background: #f1f4f7;
  }

  .timeline-bar {
    position: absolute;
    top: 4px;
    height: 12px;
    min-width: 5px;
    border-radius: 4px;
  }

  .timeline-bar.prewire { background: #14b8a6; }
  .timeline-bar.trim { background: #fb923c; }
  .timeline-bar.handover { background: #7c5cff; }
  .timeline-bar.install { background: var(--blue); }
  .timeline-today {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background: #111827;
    opacity: .38;
  }

  .timeline-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
  }

  .legend-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }

  .legend-dot.prewire { background: #14b8a6; }
  .legend-dot.trim { background: #fb923c; }
  .legend-dot.handover { background: #7c5cff; }
  .legend-dot.install { background: var(--blue); }

  .project-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .project-card.has-signal {
    border-left: 3px solid var(--amber);
  }

  .project-card.has-signal.red {
    border-left-color: var(--red);
  }

  .project-summary {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 10px;
    align-items: center;
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 0;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }

  .project-summary:hover {
    background: #fbfcfd;
  }

  .project-title {
    font-size: 14px;
    font-weight: 800;
    line-height: 1.25;
  }

  .project-sub {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }

  .state-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: max-content;
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 800;
  }

  .state-badge.compact {
    padding: 4px 8px;
    font-size: 11px;
  }

  .state-badge::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .state-badge.not-started,
  .state-badge.not-scheduled {
    background: #eef1f5;
    color: var(--muted);
  }
  .state-badge.pre-wire { background: #e7f8f5; color: #0f766e; }
  .state-badge.trim { background: var(--amber-bg); color: var(--amber); }
  .state-badge.install { background: var(--blue-bg); color: var(--blue); }
  .state-badge.wpr-handover { background: #f0edff; color: #6d4bd9; }

  .metric {
    min-width: 0;
  }

  .metric strong {
    display: block;
    font-size: 18px;
  }

  .metric span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
  }

  .metric-strip {
    display: grid;
    grid-template-columns: repeat(4, minmax(44px, 1fr));
    gap: 6px;
  }

  .metric-strip .metric {
    border: 1px solid #edf0f4;
    border-radius: 7px;
    padding: 7px 8px;
    background: #fbfcfd;
  }

  .metric.open-metric {
    display: grid;
    grid-template-columns: minmax(28px, 1fr) auto;
    grid-template-rows: auto auto;
    align-items: center;
    column-gap: 8px;
  }

  .open-source-breakdown {
    grid-column: 2;
    grid-row: 1 / 3;
    display: grid;
    align-content: center;
    gap: 2px;
    width: 50px;
    border: 1px solid #e2e7ee;
    border-radius: 6px;
    padding: 4px 5px;
    background: #fff;
    color: var(--muted);
    font-size: 8.5px;
    font-weight: 850;
    line-height: 1;
    white-space: nowrap;
  }

  .metric .open-source-breakdown span {
    display: initial;
    margin-top: 0;
    color: inherit;
    font-size: inherit;
    font-weight: inherit;
  }

  .open-source-row {
    display: grid;
    grid-template-columns: 13px minmax(0, 1fr);
    align-items: baseline;
    gap: 4px;
  }

  .open-source-count {
    color: var(--text);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .open-source-label {
    min-width: 0;
    overflow: hidden;
    text-align: left;
  }

  .expand-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    border-radius: 7px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  .expand-button[aria-expanded="true"] {
    color: var(--blue);
    border-color: #cbd9fb;
    background: var(--blue-bg);
  }

  .project-file {
    border-top: 1px solid #edf0f4;
    padding: 12px;
    display: grid;
    grid-template-columns: minmax(160px, .65fr) minmax(220px, 1fr);
    gap: 12px;
    background: #fff;
  }

  .project-file[hidden] {
    display: none;
  }

  .file-panel {
    border: 1px solid #edf0f4;
    border-radius: 8px;
    padding: 10px;
    background: #fbfcfd;
  }

  details.file-panel {
    display: block;
  }

  .mobile-section > summary.file-label {
    list-style: none;
    cursor: default;
  }

  .mobile-section > summary.file-label::-webkit-details-marker {
    display: none;
  }

  .mobile-section-body {
    margin-top: 8px;
  }

  @media (min-width: 521px) {
    .mobile-section > summary.file-label {
      pointer-events: none;
    }
  }

  .bigd-contact-card {
    margin-top: 9px;
    border: 1px solid #e2e7ee;
    border-radius: 7px;
    background: #fff;
    overflow: hidden;
  }

  .bigd-contact-primary {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    padding: 7px 8px;
    border-bottom: 1px solid #edf0f4;
  }

  .bigd-contact-primary span,
  .bigd-contact-row span {
    display: block;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 750;
    line-height: 1.25;
  }

  .bigd-contact-primary strong {
    display: block;
    margin-top: 2px;
    color: var(--text);
    font-size: 12px;
    line-height: 1.25;
  }

  .bigd-contact-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .bigd-contact-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2px 6px;
    align-items: baseline;
    min-width: 0;
    padding: 5px 7px;
    border-top: 1px solid #f2f4f7;
  }

  .bigd-contact-row:nth-child(-n + 2) {
    border-top: 0;
  }

  .bigd-contact-row:nth-child(odd) {
    border-right: 1px solid #f2f4f7;
  }

  .bigd-contact-row strong {
    display: block;
    grid-column: 1;
    min-width: 0;
    color: var(--text);
    font-size: 11.5px;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bigd-contact-row span {
    grid-column: 1 / -1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bigd-contact-phone {
    display: block;
    margin-top: 0;
    color: var(--blue);
    font-size: 11.5px;
    font-weight: 800;
    text-decoration: none;
    white-space: nowrap;
  }

  .timeline-edit-grid {
    display: grid;
    gap: 8px;
  }

  .phase-select-row {
    display: grid;
    grid-template-columns: minmax(150px, 240px);
    margin-bottom: 9px;
  }

  .timeline-edit-row {
    display: grid;
    grid-template-columns: minmax(92px, .8fr) minmax(110px, 1fr) minmax(110px, 1fr) auto;
    align-items: end;
    gap: 8px;
  }

  .timeline-phase-label {
    align-self: center;
    min-width: 0;
    font-size: 12px;
    font-weight: 800;
    overflow-wrap: anywhere;
  }

  .timeline-complete-field {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
    padding-bottom: 1px;
  }

  .timeline-complete-field input {
    width: 17px;
    height: 17px;
    accent-color: var(--blue);
  }

  .timeline-readonly-list {
    display: grid;
    gap: 7px;
  }

  .timeline-readonly-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    border: 1px solid #edf0f4;
    border-radius: 7px;
    padding: 7px 8px;
    background: #fff;
    font-size: 12px;
  }

  .approval-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
  }

  .approval-metric {
    border: 1px solid #edf0f4;
    border-radius: 7px;
    padding: 7px 8px;
    background: #fff;
    min-width: 0;
  }

  .approval-metric strong {
    display: block;
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .approval-metric span {
    display: block;
    margin-bottom: 3px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .approval-metric.good strong { color: var(--green); }
  .approval-metric.watch strong { color: var(--amber); }
  .approval-metric.bad strong { color: var(--red); }

  .file-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .links {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 9px;
  }

  .links a {
    color: var(--blue);
    background: var(--blue-bg);
    border: 1px solid #cbd9fb;
    border-radius: 6px;
    padding: 4px 7px;
    font-size: 11px;
    font-weight: 750;
    text-decoration: none;
  }

  .compact-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .compact-field label {
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .compact-field input,
  .compact-field select,
  .compact-field textarea,
  .project-template input,
  .project-template select,
  .task-input,
  .add-task-row textarea {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 7px 8px;
  }

  .compact-field textarea,
  .add-task-row textarea {
    min-height: 44px;
    resize: vertical;
  }

  .control-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .control-grid .full {
    grid-column: 1 / -1;
  }

  .close-project-panel {
    display: flex;
    justify-content: flex-end;
    background: #fbfcfd;
  }

  .close-project-actions {
    display: grid;
    gap: 9px;
  }

  .close-project-warning {
    border-color: #f0b8b8;
    background: var(--red-bg);
  }

  .close-project-warning .close-project-actions {
    justify-items: start;
  }

  .close-confirm-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .confirm-close {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr);
    gap: 8px;
    align-items: start;
    color: var(--red);
    font-size: 12px;
    font-weight: 750;
    line-height: 1.35;
  }

  .confirm-close input {
    margin-top: 1px;
  }

  .task-list {
    display: grid;
    gap: 7px;
  }

  .task-group {
    display: grid;
    gap: 7px;
  }

  .task-group + .task-group {
    margin-top: 7px;
  }

  .task-group-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: 850;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .closed-task-section {
    margin-top: 16px;
    padding: 12px;
    border: 1px solid #dfe4eb;
    border-radius: 8px;
    background: #f4f6f8;
  }

  .closed-task-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    border: 0;
    background: transparent;
    color: #6b7280;
    padding: 0;
    font: inherit;
    cursor: pointer;
    text-align: left;
  }

  .closed-task-toggle .task-group-title {
    color: #6b7280;
    margin: 0;
  }

  .closed-task-toggle-count {
    color: var(--muted);
    font-size: 11px;
    font-weight: 750;
    white-space: nowrap;
  }

  .closed-task-content {
    margin-top: 10px;
  }

  .task-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 116px;
    gap: 8px;
    align-items: start;
    border: 1px solid #edf0f4;
    border-radius: 8px;
    background: #fff;
    padding: 8px;
  }

  .task-row.todo-item {
    border-left: 4px solid #d8ad54;
    background: #fffaf0;
  }

  .task-row.note-item {
    border-left: 4px solid #a9c3fb;
    background: #f4f8ff;
  }

  .task-row.todo-item .task-title {
    color: #4f3b16;
  }

  .task-row.note-item .task-title {
    color: #254d86;
  }

  .task-row.closed {
    border-color: #dfe4eb;
    border-left-color: #c8d0da;
    background: #eef1f5;
    color: var(--muted);
  }

  .task-row.closed .task-title {
    color: #6b7280;
  }

  .task-row.closed .task-meta {
    color: #8a94a3;
  }

  .task-title {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .task-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
  }

  .overview-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(15, 23, 42, .36);
  }

  .overview-dialog {
    width: min(560px, 100%);
    max-height: min(680px, calc(100vh - 36px));
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    box-shadow: 0 24px 60px rgba(21, 32, 43, .24);
  }

  .overview-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid #edf0f4;
  }

  .overview-head h2 {
    margin: 0;
    font-size: 18px;
  }

  .overview-head span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .overview-list {
    display: grid;
    gap: 7px;
    max-height: min(500px, calc(100vh - 160px));
    overflow: auto;
    padding: 12px 16px 16px;
  }

  .overview-row {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    border: 1px solid #edf0f4;
    border-radius: 8px;
    background: #fbfcfd;
    padding: 10px;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .overview-row:hover,
  .overview-row:focus-visible {
    border-color: #bac5d4;
    outline: 0;
  }

  .overview-title {
    font-size: 13px;
    font-weight: 850;
    overflow-wrap: anywhere;
  }

  .overview-meta {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 650;
  }

  .overview-count {
    border-radius: 999px;
    background: var(--blue-bg);
    color: var(--blue);
    padding: 5px 8px;
    font-size: 11px;
    font-weight: 850;
    white-space: nowrap;
  }

  .source-link {
    color: var(--blue);
    text-decoration: none;
  }

  .source-chip {
    display: inline-flex;
    align-items: center;
    width: max-content;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 10.5px;
    font-weight: 850;
    line-height: 1.2;
    text-decoration: none;
  }

  .source-chip.pulse {
    background: #f0f6ff;
    border-color: #b9d5ff;
    color: #0b63ce;
  }

  .source-chip.procore {
    background: #fff3e6;
    border-color: #ffc98a;
    color: #c45f00;
  }

  .source-chip.closed {
    background: #e8ecf1;
    border-color: #d1d8e0;
    color: #7b8492;
  }

  .source-chip.command,
  .source-chip.other {
    background: #f4f6f8;
    border-color: var(--border);
    color: var(--muted);
  }

  .state-chip {
    display: inline-flex;
    align-items: center;
    width: max-content;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 7px;
    background: #fff;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 850;
    line-height: 1.2;
  }

  .state-chip.todo,
  .state-chip.initiated {
    border-color: #f0d49a;
    background: var(--amber-bg);
    color: var(--amber);
  }

  .state-chip.note,
  .state-chip.ready-for-review {
    border-color: #cbd9fb;
    background: var(--blue-bg);
    color: var(--blue);
  }

  .state-chip.done,
  .state-chip.closed {
    border-color: #d5dbe3;
    background: #eef1f5;
    color: #6b7280;
  }

  .add-task-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 118px auto;
    gap: 8px;
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px dashed var(--border);
  }

  .primary-button {
    border: 0;
    border-radius: 7px;
    background: var(--blue);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    padding: 8px 12px;
    cursor: pointer;
  }

  .secondary-button {
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    font-size: 12px;
    font-weight: 800;
    padding: 8px 12px;
    cursor: pointer;
  }

  .danger-button {
    width: max-content;
    border: 1px solid #e3a1a1;
    border-radius: 7px;
    background: #fff;
    color: var(--red);
    font-size: 12px;
    font-weight: 850;
    padding: 8px 12px;
    cursor: pointer;
  }

  .primary-button:disabled,
  .secondary-button:disabled,
  .danger-button:disabled,
  .task-input:disabled,
  .control-input:disabled,
  .phase-input:disabled,
  .timeline-input:disabled {
    opacity: .65;
    cursor: default;
  }

  .task-status-input.todo {
    border-color: #d8ad54;
    background: var(--amber-bg);
    color: var(--amber);
    font-weight: 850;
  }

  .task-status-input.note {
    border-color: #a9c3fb;
    background: var(--blue-bg);
    color: var(--blue);
    font-weight: 850;
  }

  .task-status-input.done {
    border-color: #c8d0da;
    background: #eef1f5;
    color: #6b7280;
    font-weight: 850;
  }

  .project-signal {
    display: block;
  }

  .project-file .project-signal {
    grid-column: 1 / -1;
  }

  .signal-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .signal-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 7px;
  }

  .signal-pill {
    display: grid;
    grid-template-columns: 7px minmax(0, 1fr);
    align-items: start;
    gap: 6px;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    background: #fff;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    line-height: 1.35;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  .signal-pill.more {
    background: #f5f7fa;
    color: var(--muted);
    grid-template-columns: 1fr;
  }

  .signal-pill.more::before {
    display: none;
  }

  .signal-pill::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    flex: 0 0 auto;
  }

  .signal-pill.red {
    background: var(--red-bg);
    border-color: #f3c5c5;
    color: var(--red);
  }

  .signal-pill.red::before {
    background: var(--red);
  }

  .signal-pill.amber {
    background: var(--amber-bg);
    border-color: #efd28f;
    color: var(--amber);
  }

  .empty {
    border: 1px dashed var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 18px;
    color: var(--muted);
    font-size: 14px;
  }

  @media (max-width: 980px) {
    .topbar {
      grid-template-columns: 1fr;
    }

    .metric-strip {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .project-file {
      grid-template-columns: 1fr;
    }

    .timeline-edit-row {
      grid-template-columns: minmax(96px, .7fr) minmax(110px, 1fr) minmax(110px, 1fr) auto;
    }

    .template-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .kpis {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .attention-list {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 520px) {
    .topbar,
    main {
      padding-left: 14px;
      padding-right: 14px;
    }

    .kpis {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .kpi {
      padding: 10px;
    }

    .kpi strong {
      font-size: 20px;
    }

    .status-row {
      margin-bottom: 10px;
    }

    .section-head {
      align-items: flex-start;
      flex-direction: column;
    }

    .schedule-overview-section {
      display: none;
    }

    .template-grid {
      grid-template-columns: 1fr;
    }

    .filters {
      flex-wrap: nowrap;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 3px;
    }

    .chip {
      white-space: nowrap;
    }

    .metric-strip {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .timeline-edit-row {
      grid-template-columns: 1fr 1fr auto;
    }

    .timeline-phase-label {
      grid-column: 1 / -1;
    }

    .project-signal {
      gap: 7px;
    }

    .signal-list {
      grid-template-columns: 1fr;
    }

    .signal-pill {
      border-radius: 7px;
      align-items: flex-start;
    }

    .project-file {
      gap: 8px;
      padding: 8px;
    }

    .mobile-section {
      padding: 0;
      overflow: hidden;
    }

    .mobile-section > summary.file-label {
      min-height: 42px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .mobile-section > summary.file-label::after {
      content: "+";
      width: 22px;
      height: 22px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      background: #fff;
      font-size: 15px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .mobile-section[open] > summary.file-label::after {
      content: "-";
      color: var(--blue);
      border-color: #cbd9fb;
      background: var(--blue-bg);
    }

    .mobile-section-body {
      margin-top: 0;
      padding: 0 10px 10px;
    }

    .settings-grid {
      grid-template-columns: 1fr;
    }

    .settings-form {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div>
      <h1><button class="brand-reset" id="homeResetButton" type="button" aria-label="Refresh Command Center and return to the default view"><svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 64" width="560" height="64" aria-hidden="true" focusable="false"><g><rect x="4" y="4" width="24" height="24" rx="6" fill="#0F172A"></rect><rect x="4" y="36" width="24" height="24" rx="6" fill="#0F172A"></rect><rect x="36" y="36" width="24" height="24" rx="6" fill="#0F172A"></rect><rect x="36" y="4" width="24" height="24" rx="6" fill="#2563EB"></rect></g><text x="80" y="44" font-family="Sweet Sans Pro, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" letter-spacing="0.24"><tspan fill="#2563EB" font-weight="700">WPR</tspan><tspan fill="#0F172A" font-weight="400" dx="10">Command Center</tspan></text></svg></button></h1>
    </div>
    <input class="search" id="searchInput" type="search" placeholder="Search project, area, team, phase">
  </div>
</header>

<main>
  <div class="sync-banner" id="syncBanner" style="display:none;"></div>
  <div class="status-row">
    <div class="updated" id="updatedText">Loading project data...</div>
    <div class="status-actions">
      <button class="auth-button" id="authButton" type="button">Edit Access</button>
      <button class="auth-button" id="settingsButton" type="button">Settings</button>
      <div class="filters" id="filters"></div>
    </div>
  </div>
  <section class="source-freshness" id="sourceFreshness"></section>
  <section id="settingsPanel"></section>

  <section class="kpis" id="kpis"></section>
  <div id="overviewModal"></div>

  <section>
    <div class="section-head">
      <h2>Attention Needed</h2>
      <div class="count" id="attentionCount"></div>
    </div>
    <div class="attention-list" id="attentionList"></div>
  </section>

  <section class="schedule-overview-section">
    <div class="section-head">
      <h2>Schedule Timeline</h2>
      <div class="count" id="timelineCount"></div>
    </div>
    <div class="timeline-wrap">
      <div class="timeline-grid">
        <div class="timeline-months">
          <div></div>
          <div class="month-track" id="timelineMonths"></div>
        </div>
        <div id="timelineRows"></div>
      </div>
      <div class="timeline-legend">
        <span><span class="legend-dot prewire"></span>Pre-Wire</span>
        <span><span class="legend-dot trim"></span>Trim</span>
        <span><span class="legend-dot handover"></span>WPR Handover</span>
        <span><span class="legend-dot install"></span>Install</span>
      </div>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Projects</h2>
      <div class="section-title-actions">
        <button class="secondary-button" id="addProjectToggle" type="button">Add Project</button>
        <div class="count" id="projectCount"></div>
      </div>
    </div>
    <div id="projectTemplate"></div>
    <div class="project-list" id="projectList"></div>
  </section>
</main>

<script>
const AUTH_STORAGE_KEY = "wprCommandCenterAuth";

const state = {
  projects: [],
  filter: "all",
  query: "",
  attentionExpanded: false,
  addProjectOpen: false,
  overviewKey: "",
  expandedProjects: new Set(),
  expandedClosedItems: new Set(),
  closingProjects: new Set(),
  settingsOpen: false,
  settings: { notifications: { recipients: [], emailConfigured: false }, sources: [] },
  pulseSync: { input: "", preview: null },
  saving: false,
  live: false,
  auth: loadAuthSession()
};

const API_URL = "https://wpr-command-center-api.wpr-command-center.workers.dev";
const SYNC_ENABLED = API_URL.indexOf("http") === 0;
const COLLAPSED_ATTENTION_LIMIT = 6;
const PULSE_PROJECTS_URL = "https://www.pulsecentral.ai/c/ati-of-america/projects";
const PULSE_DASHBOARD_URL = "https://www.pulsecentral.ai/c/ati-of-america/pm-contracts/ati/dashboard";
const PROCORE_URL = "https://app.procore.com/";
const CLOSE_PROJECT_CONFIRMATION = "Are you sure you want to close this project? After this action you will no longer be able to access any data stored within the Command Center";
const TIMELINE_PHASE_ORDER = ["prewire", "trim", "handover", "install"];
const KPI_OVERVIEWS = {
  overdueTasks: {
    title: "Overdue Tasks",
    empty: "No overdue tasks match the current view.",
    countLabel: "overdue",
    items: projects => projects.filter(project => project.overdueTasks > 0).map(project => ({
      project,
      count: project.overdueTasks,
      detail: `${project.phase || "No phase"} · ${project.area || "Unassigned"}`
    }))
  },
  highPriorityTasks: {
    title: "High Priority",
    empty: "No high priority items match the current view.",
    countLabel: "high",
    items: projects => projects.filter(project => project.highPriorityTasks > 0).map(project => ({
      project,
      count: project.highPriorityTasks,
      detail: `${project.phase || "No phase"} · ${project.area || "Unassigned"}`
    }))
  },
  risks: {
    title: "Open Risks",

async function loadData() {
  if (SYNC_ENABLED) {
    try {
      const headers = authIsValid() ? { "x-command-center-session": state.auth.token } : {};
      const response = await fetch(API_URL, { cache: "no-store", headers });
      if (!response.ok) throw new Error(`Live API unavailable (${response.status})`);
      const data = await response.json();
      const projects = Array.isArray(data) ? data : data.data;
      if (!Array.isArray(projects)) throw new Error("Live API returned no project list");
      state.projects = normalizeProjects(projects);
      state.settings = normalizeSettings(data.settings);
      state.live = true;
      document.getElementById("updatedText").textContent = "Live Command Center data";
      showSyncBanner("none");
      render();
      renderAuthStatus();
      return;
    } catch (error) {
      console.error("Live API load failed:", error);
      state.live = false;
      showSyncBanner("error", "Live editing is unavailable right now. Showing the latest hosted snapshot.");
    }
  }

  try {
    const response = await fetch("data/projects.json", { cache: "no-store" });
    if (!response.ok) throw new Error("Data file unavailable");
    const data = await response.json();
    state.projects = normalizeProjects(data.projects);
    document.getElementById("updatedText").textContent = `Last updated ${formatDateTime(data.lastUpdated)} from ${data.source || "Command Center"}`;
  } catch (error) {
    state.projects = normalizeProjects(fallbackData.projects);
    state.settings = normalizeSettings();
    document.getElementById("updatedText").textContent = "Project data could not be loaded.";
  }
  render();
}

function showSyncBanner(kind, message = "") {
  const banner = document.getElementById("syncBanner");
  if (kind === "none") {
    banner.style.display = "none";
    banner.textContent = "";
    return;
  }
  banner.style.display = "block";
  banner.classList.toggle("error", kind === "error");
  banner.textContent = message;
}

async function postUpdate(action, payload) {
  if (!state.live || !SYNC_ENABLED) throw new Error("Live editing is not connected.");
  const auth = await ensureEditAccess();
  state.saving = true;
  renderProjects();
  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-command-center-session": auth.token,
        "x-command-center-initials": auth.initials
      },
      body: JSON.stringify({ action, ...payload })
    });
    if (response.status === 401) {
      clearAuthSession();
      renderAuthStatus();
      throw new Error("Edit access expired. Please reconnect edit access.");
    }
    const responseText = await response.text();
    let data = {};
    try {
      data = responseText ? JSON.parse(responseText) : {};
    } catch {
      data = {};
    }
    if (!response.ok || data.ok === false) throw new Error(data.error || `Save failed (${response.status})`);
    const projects = Array.isArray(data) ? data : data.data;
    if (Array.isArray(projects)) state.projects = normalizeProjects(projects);
    state.settings = normalizeSettings(data.settings);
    showSyncBanner("none");
  } finally {
    state.saving = false;
    render();
  }
}

function normalizeProjects(projects) {
  return Array.isArray(projects) ? projects.filter(isDashboardProject).map(project => ({
    id: project.id || project.name,
    name: project.name || "Untitled project",
    area: project.area || project.segment || project.projectGroup || "Unassigned",
    team: project.team || project.externalTeam || "No team listed",
    phase: currentProjectPhase(project.timelines) || project.phase || "Not Started",
    startDate: project.startDate || project.startsAt || null,
    endDate: project.endDate || project.endsAt || null,
    openTasks: Number(project.openTasks) || openTaskCount(project),
    overdueTasks: Number(project.overdueTasks) || 0,
    highPriorityTasks: Number(project.highPriorityTasks) || 0,
    risks: Number(project.risks) || (Array.isArray(project.risks) ? project.risks.length : 0),
    nextHandoff: project.nextHandoff || null,
    approvalsPayments: normalizeApprovalsPayments(project.approvalsPayments, project.control),
    control: normalizeControl(project.control, project.id),
    taskList: normalizeTaskList(project.taskList),
    openSourceCounts: openSourceCounts(project.taskList),
    attention: Array.isArray(project.attention) ? project.attention : [],
    links: Array.isArray(project.links) ? project.links : [],
    timelines: normalizeTimelines(project.timelines)
  })) : [];
}

function normalizeTimelines(timelines) {
  return (Array.isArray(timelines) ? timelines : [])
    .map(item => ({
      key: item.key || "",
      label: item.label || "",
      start: item.start || null,
      end: item.end || null,
      status: item.status || ""
    }))
    .sort((a, b) => timelinePhaseIndex(a.key) - timelinePhaseIndex(b.key));
}

function timelinePhaseIndex(key) {
  const index = TIMELINE_PHASE_ORDER.indexOf(key);
  return index === -1 ? TIMELINE_PHASE_ORDER.length : index;
}

function normalizeSettings(settings = {}) {
  const notifications = settings.notifications && typeof settings.notifications === "object" ? settings.notifications : {};
  const recipients = Array.isArray(notifications.recipients) ? notifications.recipients : [];
  const sources = Array.isArray(settings.sources) ? settings.sources : [];
  return {
    notifications: {
      recipients: recipients.map(item => ({
        email: String(item.email || "").trim(),
        createdBy: String(item.createdBy || "").trim(),
        createdAt: String(item.createdAt || "").trim()
      })).filter(item => item.email),
      emailConfigured: notifications.emailConfigured === true,
      recent: Array.isArray(notifications.recent) ? notifications.recent.map(item => ({
        createdAt: String(item.createdAt || "").trim(),
        status: String(item.status || "").trim(),
        subject: String(item.subject || "").trim(),
        recipientCount: Number(item.recipientCount) || 0,
        providerId: String(item.providerId || "").trim(),
        error: String(item.error || "").trim()
      })) : []
    },
    sources: sources.map(item => ({
      source: String(item.source || "").trim(),
      label: String(item.label || item.source || "Source").trim(),
      status: String(item.status || "unknown").trim(),
      lastAttemptAt: String(item.lastAttemptAt || "").trim(),
      lastSuccessAt: String(item.lastSuccessAt || "").trim(),
      recordsSeen: Number(item.recordsSeen) || 0,
      recordsWritten: Number(item.recordsWritten) || 0,
      projectCount: Number(item.projectCount) || 0,
      message: String(item.message || "").trim(),
      updatedAt: String(item.updatedAt || "").trim(),
      updatedBy: String(item.updatedBy || "").trim()
    })).filter(item => item.source)
  };
}

function normalizeApprovalsPayments(value, control = {}) {
  const incoming = value && typeof value === "object" ? value : {};
  const source = control && typeof control === "object" ? control : {};
  return {
    contract: String(incoming.contract || source.contractStatus || "").trim(),
    deposit: String(incoming.deposit || source.depositStatus || "").trim(),
    changeOrders: String(incoming.changeOrders || source.changeOrderStatus || "").trim()
  };
}

function normalizeControl(value, projectId) {
  const incoming = value && typeof value === "object" ? value : {};
  const explicitState = controlHasExplicitState(incoming);
  return {
    projectId,
    operatingState: normalizeProjectState(incoming.operatingState, explicitState),
    nextOutcome: String(incoming.nextOutcome || "").trim(),
    nextMoveOwner: String(incoming.nextMoveOwner || "").trim(),
    nextAction: String(incoming.nextAction || "").trim(),
    reviewDate: dateOnly(incoming.reviewDate) || "",
    responseDate: dateOnly(incoming.responseDate) || "",
    blocked: incoming.blocked === true || incoming.blocked === "true" || incoming.blocked === "TRUE",
    blockerReason: String(incoming.blockerReason || "").trim(),
    contractStatus: String(incoming.contractStatus || "").trim(),
    depositStatus: String(incoming.depositStatus || "").trim(),
    changeOrderStatus: String(incoming.changeOrderStatus || "").trim(),
    updatedBy: String(incoming.updatedBy || "").trim(),
    updatedAt: String(incoming.updatedAt || "").trim()
  };
}

function normalizeProjectState(value, explicitState = true) {
  const state = String(value || "").trim();
  if (["Not Set", "Action Needed", "Follow-Up Needed", "Monitor", "Stable"].includes(state)) return state;
  return explicitState ? "Stable" : "Not Set";
}

function controlHasExplicitState(control) {
  const state = String(control.operatingState || "").trim();
  if (!state) return false;
  if (state !== "Stable") return true;
  return Boolean(
    String(control.updatedBy || "").trim() ||
    String(control.updatedAt || "").trim() ||
    String(control.nextOutcome || "").trim() ||
    String(control.nextMoveOwner || "").trim() ||
    String(control.nextAction || "").trim() ||
    String(control.reviewDate || "").trim() ||
    String(control.responseDate || "").trim() ||
    String(control.blockerReason || "").trim()
  );
}

function normalizeTaskList(tasks) {
  return Array.isArray(tasks) ? tasks.map(task => ({
    id: task.id,
    name: String(task.name || "").trim(),
    status: ["todo", "note", "done"].includes(task.status) ? task.status : task.status === "progress" ? "note" : "todo",
    source: String(task.source || "").trim(),
    sourceState: String(task.sourceState || task.source_state || "").trim(),
    externalUrl: String(task.externalUrl || task.url || task.link || "").trim(),
    updatedBy: String(task.updatedBy || "").trim(),
    updatedAt: String(task.updatedAt || "").trim()
  }))
    .filter(task => task.name)
    .sort((a, b) => taskSourceRank(a.source) - taskSourceRank(b.source) || a.name.localeCompare(b.name)) : [];
}

function openTaskCount(project) {
  return normalizeTaskList(project.taskList).filter(task => task.status !== "done").length;
}

function openSourceCounts(tasks) {
  return normalizeTaskList(tasks)
    .filter(task => task.status !== "done")
    .reduce((counts, task) => {
      const group = taskSourceGroup(task.source);
      counts[group] = (counts[group] || 0) + 1;
      return counts;
    }, { procore: 0, pulse: 0, command: 0, other: 0 });
}

function currentProjectPhase(timelines = []) {
  const items = Array.isArray(timelines) ? timelines : [];
  const work = TIMELINE_PHASE_ORDER
    .filter(key => key !== "handover")
    .map(key => items.find(item => item && item.key === key))
    .filter(Boolean);
  if (!work.length) return "";
  const active = work.find(item => item.status === "active");
  if (active) return active.label || phaseLabel(active.key);
  if (!work.some(item => item.status === "complete")) return "Not Started";
  const open = work.find(item => item.status !== "complete");
  return open ? (open.label || phaseLabel(open.key)) : "Install";
}

function projectPhaseValue(project) {
  const timelines = Array.isArray(project.timelines) ? project.timelines : [];
  const active = timelines.find(item => item.status === "active");
  if (active && ["prewire", "trim", "install"].includes(active.key)) return active.key;
  const work = TIMELINE_PHASE_ORDER
    .filter(key => key !== "handover")
    .map(key => timelines.find(item => item && item.key === key))
    .filter(Boolean);
  const open = work.find(item => item.status !== "complete");
  if (open && work.some(item => item.status === "complete")) return open.key;
  if (work.length && work.every(item => item.status === "complete")) return "install";
  const phase = String(project.phase || "").toLowerCase();
  if (phase.includes("pre")) return "prewire";
  if (phase.includes("trim")) return "trim";
  if (phase.includes("install")) return "install";
  return "not-started";
}

function phaseLabel(key) {
  const option = PROJECT_PHASE_OPTIONS.find(item => item[0] === key);
  return option ? option[1] : "Not Started";
}

function isDashboardProject(project) {
  const name = String(project && project.name || "").trim();
  const area = String(project && (project.area || project.segment || project.projectGroup) || "").trim();
  const team = String(project && (project.team || project.externalTeam) || "").trim();
  return !(
    name === "Procore Observation Review" ||
    area === "Unmapped Procore" ||
    (team === "Procore" && area === "Unmapped Procore")
  );
}

    lastSuccessAt: "",
    recordsSeen: 0,
    recordsWritten: 0,
    projectCount: 0,
    message: "No sync run has been recorded yet.",
    ...(bySource.get(source) || {})
  }));
}

function freshnessClass(item) {
  if (item.status === "failed") return "failed";
  if (!item.lastSuccessAt) return "stale";
  const ageMs = Date.now() - new Date(item.lastSuccessAt).getTime();
  if (!Number.isFinite(ageMs) || ageMs > 30 * 60 * 60 * 1000) return "stale";
  return "good";
}

function freshnessStateLabel(item) {
  if (item.status === "failed") return "Failed";
  if (!item.lastSuccessAt) return "Not Recorded";
  if (freshnessClass(item) === "stale") return "Stale";
  return "Fresh";
}

function freshnessTiming(item) {
  if (item.lastSuccessAt) return `Last success ${formatDateTime(item.lastSuccessAt)}`;
  if (item.lastAttemptAt) return `Last attempt ${formatDateTime(item.lastAttemptAt)}`;
  return "No sync run recorded";
}

  };
  const cards = [
    ["projects", totals.projects, "Visible Projects"],
    ["openTasks", totals.openTasks, "Open Items"],
    ["overdueTasks", totals.overdueTasks, "Overdue Tasks"],
    ["highPriorityTasks", totals.highPriorityTasks, "High Priority"],
    ["risks", totals.risks, "Open Risks"],
    ["contractsAccepted", totals.contractsAccepted, "Contracts Accepted"],

function renderTimeline() {

  document.getElementById("timelineMonths").innerHTML = renderMonthLabels(range);

}

function renderTimelineRow(project, range) {
  const bars = project.timelines
    .map(item => {
      const seg = timelineSegment(item.start, item.end, range.min, range.max);
      if (!seg) return "";
      return `<div class="timeline-bar ${escapeHtml(item.key)}" style="left:${seg.left}%;width:${seg.width}%" title="${escapeAttribute(project.name)} - ${escapeAttribute(item.label)}: ${escapeAttribute(formatDateRange(item.start, item.end))}"></div>`;
    })
    .join("");
  const today = timelineToday(range);
  return `
    <div class="timeline-row">
      <div class="timeline-name">${escapeHtml(project.name)}</div>
      <div class="timeline-track">
        ${today === null ? "" : `<div class="timeline-today" style="left:${today}%"></div>`}
        ${bars || `<span class="project-sub" style="position:absolute;left:7px;top:3px;">Not scheduled</span>`}
      </div>
    </div>
  `;
}

function renderMonthLabels(range) {
  const labels = [];
  const start = new Date(range.min.getFullYear(), range.min.getMonth(), 1);
  for (let cursor = start; cursor <= range.max; cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1)) {
    labels.push(`<span class="month-label" style="left:${((cursor - range.min) / (range.max - range.min)) * 100}%">${cursor.toLocaleDateString("en-US", { month: "short" })}</span>`);
  }
  return labels.join("");
}

function getTimelineRange() {
  const now = new Date();
  return {
    min: new Date(now.getFullYear(), now.getMonth(), 1),
    max: new Date(now.getFullYear(), now.getMonth() + 3, 0)
  };
}

function timelineSegment(start, end, min, max) {
  const startDate = parseDate(start);
  const endDate = parseDate(end);
  if (!startDate || !endDate || endDate < min || startDate > max) return null;
  const total = max - min;
  const clippedStart = startDate < min ? min : startDate;
  const clippedEnd = endDate > max ? max : endDate;
  return {
    left: Math.max(0, ((clippedStart - min) / total) * 100),
    width: Math.max(1.5, ((clippedEnd - clippedStart) / total) * 100)
  };
}

function timelineToday(range) {
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  if (now < range.min || now > range.max) return null;
  return ((now - range.min) / (range.max - range.min)) * 100;
}

      </div>
      ${renderEditNote(project.control)}
    `;
  }
  const items = [
    ["Contract", statuses.contract, approvalClass("contract", statuses.contract)],
    ["Deposit", statuses.deposit, approvalClass("deposit", statuses.deposit)],
    ["Change Orders", statuses.changeOrders, approvalClass("changeOrders", statuses.changeOrders)]
  ];
  return `<div class="approval-grid">${items.map(([label, value, cls]) => `
    <div class="approval-metric ${cls}">
      <span>${escapeHtml(label)}</span>
      <strong>${escapeHtml(value || "Not set")}</strong>
    </div>
  `).join("")}</div>`;

function approvalClass(type, value) {
  if ((type === "contract" && value === "Accepted") || (type === "deposit" && ["Paid", "Not Required"].includes(value)) || (type === "changeOrders" && ["None", "Approved"].includes(value))) return "good";
  if ((type === "deposit" && value === "Overdue") || value === "Needs Review") return "bad";
  if (value) return "watch";
  return "";
}

function renderTaskRow(task, closed) {
  const statusClass = isManualTask(task) && task.status === "note" ? "note-item" : isManualTask(task) && task.status === "todo" ? "todo-item" : "";

function renderTaskMeta(task, closed) {

function renderTaskStateControl(task) {
  if (state.live && isManualTask(task)) {
    return `
      <select class="task-input task-status-input ${escapeAttribute(task.status)}" data-task-id="${escapeAttribute(task.id)}" data-field="status" ${state.saving ? "disabled" : ""}>
        <option value="todo" ${task.status === "todo" ? "selected" : ""}>To-Do</option>
        <option value="note" ${task.status === "note" ? "selected" : ""}>Note</option>
        <option value="done" ${task.status === "done" ? "selected" : ""}>Close</option>
      </select>
    `;
  }
  return renderStateChip(sourceStateLabel(task), sourceStateClass(task));
}

function groupedTasks(tasks) {
  const groups = [
    { key: "procore", label: "Procore", tasks: [] },
    { key: "pulse", label: "Pulse", tasks: [] },
    { key: "command", label: "Command Center", tasks: [] },
    { key: "other", label: "Other", tasks: [] }
  ];
  tasks.forEach(task => {
    const key = taskSourceGroup(task.source);
    const group = groups.find(item => item.key === key) || groups[3];
    group.tasks.push(task);
  });
  return groups.filter(group => group.tasks.length);
}

function taskSourceGroup(source) {
  if (source === "procore" || source === "procore-review" || source === "Procore") return "procore";
  if (source === "pulse" || source === "Pulse") return "pulse";
  if (!source || source === "Command Center") return "command";
  return "other";
}

function taskSourceRank(source) {
  const group = taskSourceGroup(source);
  if (group === "procore") return 1;
  if (group === "pulse") return 2;
  if (group === "command") return 3;
  return 4;
}

function renderTaskSource(task, closed = false) {
  const label = taskSourceLabel(task.source);
  const className = closed ? "closed" : taskSourceGroup(task.source);
  const url = taskSourceUrl(task);
  if (url) return `<a class="source-chip ${escapeAttribute(className)}" href="${escapeAttribute(url)}" target="_blank" rel="noopener" title="${escapeAttribute(sourceLinkTitle(label, task.externalUrl))}">${escapeHtml(label)}</a>`;
  return `<span class="source-chip ${escapeAttribute(className)}">${escapeHtml(label)}</span>`;
}

function renderSourceState(task) {
  if (isManualTask(task)) return "";

}

function renderStateChip(label, className) {
  return `<span class="state-chip ${escapeAttribute(className)}">${escapeHtml(label)}</span>`;

function sourceStateLabel(task) {
  const state = String(task.sourceState || "").trim();
  return state || taskStatusLabel(task.status);
}

function sourceStateClass(task) {
  return sourceStateLabel(task).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "todo";
}

function isManualTask(task) {
  return taskSourceGroup(task.source) === "command";
}

function taskSourceUrl(task) {
  if (task.externalUrl) return task.externalUrl;
  const group = taskSourceGroup(task.source);
  if (group === "pulse") return PULSE_PROJECTS_URL;
  if (group === "procore") return PROCORE_URL;

}

function sourceLinkTitle(label, hasExactUrl) {

function renderEditNote(item) {

function taskSourceLabel(source) {

function taskStatusLabel(status) {

function topSeverity(items) {

}

function topAttentionDetail(project) {

  if (!item) return "";
  return `${item.detail || item.label || "Review needed"}${item.dueDate ? ` · Due ${formatDate(item.dueDate)}` : ""}`;

function renderLinks(links) {

function sum(projects, key) {
  return projects.reduce((total, project) => total + (Number(project[key]) || 0), 0);
}

function severityScore(severity) {
  if (severity === "red") return 3;
  if (severity === "amber") return 2;
  if (severity === "green") return 1;
  return 0;
}

function formatDate(value) {
  const date = parseDate(value);
  return Number.isNaN(date.getTime()) ? "" : date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function parseDate(value) {
  if (!value) return new Date(NaN);
  return new Date(`${String(value).slice(0, 10)}T00:00:00`);
}

function formatDateTime(value) {
  if (!value) return "unknown";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "unknown" : date.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

function formatDateRange(startDate, endDate) {
  if (!startDate && !endDate) return "No date range";
  if (startDate && endDate) return `${formatDate(startDate)} to ${formatDate(endDate)}`;
  return startDate ? `Starts ${formatDate(startDate)}` : `Ends ${formatDate(endDate)}`;
}

function dateOnly(value) {
  if (!value) return "";
  const text = String(value).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(text)) return text.slice(0, 10);
  const date = parseDate(text);
  return Number.isNaN(date.getTime()) ? "" : date.toISOString().slice(0, 10);
}

function buildPulseSyncPreview(input) {
  const rows = parsePulseTimelineRows(input);
  const merged = new Map();
  const missing = [];

  rows.forEach(row => {
    const project = matchPulseProject(row.customer);
    if (!project) {
      missing.push({ pulseName: row.customer });
      return;
    }

    if (!merged.has(project.id)) {
      merged.set(project.id, {
        project,
        pulseName: row.customer,
        dates: { prewire: null, trim: null, install: null }
      });
    }

    const target = merged.get(project.id);
    ["prewire", "trim", "install"].forEach(key => {
      if (!row.phases[key]) return;
      if (row.dates[key] || target.dates[key] === null) target.dates[key] = row.dates[key];
    });
  });

  const matched = [...merged.values()].map(item => {
    const changes = ["prewire", "trim", "install"].flatMap(key => {
      const next = item.dates[key];
      if (next === null) return [];
      const timeline = item.project.timelines.find(row => row.key === key) || {};
      const currentStart = timeline.start || "";
      const currentEnd = timeline.end || "";
      if (currentStart === next && currentEnd === next) return [];
      return [{
        key,
        label: phaseLabel(key),
        current: currentStart === currentEnd ? currentStart : [currentStart, currentEnd].filter(Boolean).join(" to "),
        next
      }];
    });
    return {
      projectId: item.project.id,
      projectName: item.project.name,
      pulseName: item.pulseName,
      changes
    };
  });

  return {
    matched,
    missing,
    items: matched
      .filter(item => item.changes.length)
      .map(item => ({
        projectId: item.projectId,
        timelines: item.changes.map(change => ({ key: change.key, date: change.next }))
      }))
  };
}

function parsePulseTimelineRows(input) {
  const text = String(input || "").trim();
  if (!text) return [];

  const jsonRows = parsePulseJsonRows(text);
  if (jsonRows) return jsonRows;

  const lines = text.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  if (!lines.length) return [];

  const tableRows = lines
    .filter(line => line.includes("\t"))
    .map(line => line.split("\t").map(cell => cleanPulseCell(cell)));
  if (!tableRows.length) return [];

  const defaultHeaders = [
    "customer", "project manager", "prewire schedule", "prewire date",
    "trim schedule", "trim date", "install schedule", "install date",
    "racks due date", "integrations due date", "pm billing status",
    "estimated project completion date", "ati install completion date",
    "add to ati", "comments"
  ];
  const first = tableRows[0].map(normalizePulseHeader);
  const hasHeader = first.some(cell => cell === "customer") && first.some(cell => cell.includes("prewire date"));
  const headers = hasHeader ? first : defaultHeaders;
  const dataRows = hasHeader ? tableRows.slice(1) : tableRows;

  return dataRows.map(cells => pulseRowFromCells(headers, cells)).filter(row => row.customer);
}

function parsePulseJsonRows(text) {
  if (!/^[\[{]/.test(text)) return null;
  try {
    const value = JSON.parse(text);
    const rows = Array.isArray(value) ? value : Array.isArray(value.rows) ? value.rows : null;
    if (!rows) return null;
    return rows.map(row => {
      if (Array.isArray(row)) {
        return pulseRowFromCells([], row.map(cleanPulseCell));
      }
      return pulseRowFromObject(row);
    }).filter(row => row.customer);
  } catch {
    return null;
  }
}

function pulseRowFromObject(row) {
  const pick = (...keys) => {
    const found = keys.find(key => row[key] !== undefined);
    return cleanPulseCell(found ? row[found] : "");
  };
  return normalizePulseRow({
    customer: pick("Customer", "customer", "project", "name"),
    prewireSchedule: pick("Prewire Schedule", "Prewire Schedule*", "prewireSchedule"),
    prewireDate: pick("Prewire Date", "prewireDate"),
    trimSchedule: pick("Trim Schedule", "Trim Schedule*", "trimSchedule"),
    trimDate: pick("Trim Date", "trimDate"),
    installSchedule: pick("Install Schedule", "installSchedule"),
    installDate: pick("Install Date", "installDate"),
    addToAti: pick("Add to ATI", "addToATI", "addToAti")
  });
}

function pulseRowFromCells(headers, cells) {
  const get = (header, fallbackIndex) => {
    const index = headers.findIndex(item => item === header || item.includes(header));
    return cleanPulseCell(cells[index >= 0 ? index : fallbackIndex] || "");
  };
  return normalizePulseRow({
    customer: get("customer", 0),
    prewireSchedule: get("prewire schedule", 2),
    prewireDate: get("prewire date", 3),
    trimSchedule: get("trim schedule", 4),
    trimDate: get("trim date", 5),
    installSchedule: get("install schedule", 6),
    installDate: get("install date", 7),
    addToAti: get("add to ati", 13)
  });
}

function normalizePulseRow(row) {
  const addToAti = row.addToAti.toLowerCase();
  const phaseListed = key => addToAti ? addToAti.includes(key === "prewire" ? "prewire" : key) : false;
  return {
    customer: row.customer,
    dates: {
      prewire: pulseDateOnly(row.prewireDate),
      trim: pulseDateOnly(row.trimDate),
      install: pulseDateOnly(row.installDate)
    },
    phases: {
      prewire: phaseListed("prewire") || !!row.prewireSchedule || !!row.prewireDate,
      trim: phaseListed("trim") || !!row.trimSchedule || !!row.trimDate,
      install: phaseListed("install") || !!row.installSchedule || !!row.installDate
    }
  };
}

function matchPulseProject(customer) {
  const text = String(customer || "").toLowerCase();
  if (!text) return null;
  if (text.includes("skier services")) return findProjectByName("Skier Services");
  if (text.includes("penthouse")) return findProjectByName("WPR Condo Penthouse");
  if (text.includes("condo")) {
    const unit = text.match(/unit\s*(\d+)/);
    if (unit) return findProjectByName(`WPR Condo ${unit[1]}`);
  }
  const unit = text.match(/unit\s*(\d+)/);
  if (unit) return findProjectByName(`WPR Unit ${unit[1]}`);
  if (/\bd4\b/.test(text)) return findProjectByName("D4");
  if (/\bd35\b/.test(text)) return findProjectByName("D35");
  return null;
}

function findProjectByName(name) {
  const key = normalizeMatchText(name);
  return state.projects.find(project => normalizeMatchText(project.name) === key) || null;
}

function pulseDateOnly(value) {
  const text = cleanPulseCell(value);
  if (!text || text === "—" || /^tbd$/i.test(text)) return "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
  const match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!match) return "";
  const month = match[1].padStart(2, "0");
  const day = match[2].padStart(2, "0");
  return `${match[3]}-${month}-${day}`;
}

function cleanPulseCell(value) {
  return String(value ?? "").replace(/\u00a0/g, " ").trim();
}

function normalizePulseHeader(value) {
  return cleanPulseCell(value).toLowerCase().replace(/[▲*]/g, "").replace(/\s+/g, " ").trim();
}

function normalizeMatchText(value) {
  return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value).replaceAll("`", "&#096;");
}

function cssEscape(value) {
  if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(String(value));
  return String(value).replace(/["\\]/g, "\\$&");
}

document.getElementById("filters").addEventListener("click", event => {

document.addEventListener("click", event => {
  if (event.target.closest("#homeResetButton")) {
    window.location.reload();
    return;
  }

  if (event.target.hasAttribute("data-overview-close")) {
    state.overviewKey = "";
    renderOverviewModal();
    return;
  }

  const overviewButton = event.target.closest("[data-kpi-key]");
  if (overviewButton) {
    state.overviewKey = overviewButton.dataset.kpiKey;
    renderOverviewModal();
    return;
  }

  const overviewProject = event.target.closest("[data-overview-project]");
  if (overviewProject) {
    const projectId = String(overviewProject.dataset.overviewProject);
    state.expandedProjects.add(projectId);
    state.overviewKey = "";
    renderProjects();
    renderOverviewModal();
    const card = document.querySelector(`[data-project-card="${cssEscape(projectId)}"]`);
    if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }

  if (event.target.closest("#attentionToggle")) {
    state.attentionExpanded = !state.attentionExpanded;
    renderAttention();
    return;
  }

  if (event.target.closest("#settingsButton")) {
    state.settingsOpen = !state.settingsOpen;
    renderSettings();
    return;
  }

  if (event.target.closest("#addRecipientButton")) {
    const email = valueFrom("notificationEmailInput");
    if (!email) {
      showSyncBanner("error", "Email address is required.");
      return;
    }
    postUpdate("addNotificationRecipient", { email }).catch(error => {
      console.error("Add notification recipient failed:", error);
      showSyncBanner("error", error.message || "Notification recipient could not be added.");
    });
    return;
  }

  if (event.target.closest("#previewPulseSyncButton")) {
    state.pulseSync.input = valueFrom("pulseSyncInput");
    const preview = buildPulseSyncPreview(state.pulseSync.input);
    if (!preview.matched.length && !preview.missing.length) {
      showSyncBanner("error", "No Pulse table rows were found. Copy rows from the Pulse dashboard table and paste them here.");
      return;
    }
    state.pulseSync.preview = preview;
    renderSettings();
    return;
  }

  if (event.target.closest("#clearPulseSyncButton")) {
    state.pulseSync = { input: "", preview: null };
    renderSettings();
    return;
  }

  if (event.target.closest("#applyPulseSyncButton")) {
    const preview = state.pulseSync.preview;
    const items = preview && Array.isArray(preview.items) ? preview.items : [];
    if (!items.length) {
      showSyncBanner("error", "No Pulse date changes are ready to apply.");
      return;
    }
    postUpdate("syncPulseTimelines", { items }).then(() => {
      state.pulseSync.preview = null;
      showSyncBanner("none");
      renderSettings();
    }).catch(error => {
      console.error("Pulse timeline sync failed:", error);
      showSyncBanner("error", error.message || "Pulse timeline dates could not be synced.");
    });
    return;
  }

  const removeRecipientButton = event.target.closest(".remove-recipient-button");
  if (removeRecipientButton) {
    const email = removeRecipientButton.dataset.email;
    postUpdate("removeNotificationRecipient", { email }).catch(error => {
      console.error("Remove notification recipient failed:", error);
      showSyncBanner("error", error.message || "Notification recipient could not be removed.");
    });
    return;
  }

  const closedToggle = event.target.closest("[data-closed-toggle]");
  if (closedToggle) {
    const projectId = String(closedToggle.dataset.closedToggle);
    if (state.expandedClosedItems.has(projectId)) state.expandedClosedItems.delete(projectId);
    else state.expandedClosedItems.add(projectId);
    renderProjects();
    return;
  }

  if (event.target.closest("#addProjectToggle")) {
    if (!state.live) {
      showSyncBanner("error", "Live editing is unavailable right now. A project can only be added when the online database is connected.");
      return;
    }
    state.addProjectOpen = !state.addProjectOpen;
    renderProjectTemplate();
    return;
  }

  if (event.target.closest("#cancelProjectButton")) {
    state.addProjectOpen = false;
    renderProjectTemplate();
    return;
  }

  if (event.target.closest("#createProjectButton")) {
    const payload = readNewProjectTemplate();
    if (!payload.name) {
      showSyncBanner("error", "Project name is required.");
      return;
    }
    postUpdate("addProject", payload).then(() => {
      state.addProjectOpen = false;
      renderProjectTemplate();
    }).catch(error => {
      console.error("Add project failed:", error);
      showSyncBanner("error", error.message || "Project could not be added.");
    });
    return;
  }

  const closeProjectStart = event.target.closest(".close-project-start");
  if (closeProjectStart) {
    state.closingProjects.add(String(closeProjectStart.dataset.projectId));
    renderProjects();
    return;
  }

  const closeProjectCancel = event.target.closest(".close-project-cancel");
  if (closeProjectCancel) {
    state.closingProjects.delete(String(closeProjectCancel.dataset.projectId));
    renderProjects();
    return;
  }

  const closeProjectButton = event.target.closest(".close-project-button");
  if (closeProjectButton) {
    const projectId = closeProjectButton.dataset.projectId;
    const project = state.projects.find(item => String(item.id) === String(projectId));
    const checkbox = document.querySelector(`[data-close-confirm="${cssEscape(projectId)}"]`);
    if (!checkbox || !checkbox.checked) return;
    if (!window.confirm(CLOSE_PROJECT_CONFIRMATION)) return;
    postUpdate("closeProject", { projectId, confirmed: true, confirmationMessage: CLOSE_PROJECT_CONFIRMATION }).then(() => {
      state.expandedProjects.delete(String(projectId));
      state.closingProjects.delete(String(projectId));
      showSyncBanner("none");
    }).catch(error => {
      console.error("Close project failed:", error);
      showSyncBanner("error", error.message || `${project ? project.name : "Project"} could not be closed.`);
    });
    return;
  }

  const addTaskButton = event.target.closest(".add-task-button");
  if (addTaskButton) {
    const projectId = addTaskButton.dataset.projectId;
    const field = document.getElementById(`newTask-${projectId}`);
    const statusField = document.getElementById(`newTaskStatus-${projectId}`);
    const name = field ? field.value.trim() : "";
    const status = statusField ? statusField.value : "todo";
    if (!name) return;
    postUpdate("addTask", { projectId, name, status }).catch(error => {
      console.error("Add task failed:", error);
      showSyncBanner("error", error.message || "Task could not be added.");
    });
    return;
  }

  const projectToggle = event.target.closest("[data-project-toggle]");
  if (!projectToggle) return;
  const id = projectToggle.dataset.projectToggle;
  if (state.expandedProjects.has(id)) state.expandedProjects.delete(id);
  else state.expandedProjects.add(id);
  renderProjects();
});

  const taskInput = event.target.closest(".task-input");
  if (taskInput && taskInput.dataset.taskId && taskInput.dataset.field) {
    const taskId = taskInput.dataset.taskId;
    const field = taskInput.dataset.field;
    const value = taskInput.value;
    postUpdate("updateTask", { taskId, field, value }).catch(error => {
      console.error("Task update failed:", error);
      showSyncBanner("error", error.message || "Task could not be saved.");
    });
  }
});

function readNewProjectTemplate() {
  return {
    name: valueFrom("newProjectName"),
    projectGroup: valueFrom("newProjectGroup") || "Other Projects",
    segment: valueFrom("newProjectSegment"),
    externalTeam: valueFrom("newProjectTeam"),
    startsAt: valueFrom("newProjectStart"),
    endsAt: valueFrom("newProjectEnd")
  };
}

function valueFrom(id) {
  const element = document.getElementById(id);
  return element ? element.value.trim() : "";
}

document.getElementById("searchInput").addEventListener("input", event => {
  state.query = event.target.value;
  render();
});

window.addEventListener("resize", syncMobileProjectSections);

document.getElementById("authButton").addEventListener("click", async () => {
  if (authIsValid()) {
    if (!window.confirm(`Edit access is connected as ${state.auth.initials}. Reset edit access?`)) return;
    clearAuthSession();
    renderAuthStatus();
    return;
  }
  try {
    await requestEditAccess();
    renderAuthStatus();
  } catch (error) {
    showSyncBanner("error", error.message || "Edit access could not be connected.");
  }
});

function loadAuthSession() {
  try {
    return JSON.parse(window.localStorage.getItem(AUTH_STORAGE_KEY) || "null");
  } catch {
    return null;
  }
}

function saveAuthSession(auth) {
  state.auth = auth;
  window.localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(auth));
}

function clearAuthSession() {
  state.auth = null;
  window.localStorage.removeItem(AUTH_STORAGE_KEY);
}

function authIsValid() {
  return !!(state.auth && state.auth.token && state.auth.initials && Number(state.auth.expiresAt) > Date.now());
}

async function ensureEditAccess() {
  if (authIsValid()) return state.auth;
  return requestEditAccess();
}

async function requestEditAccess() {
  const initials = (window.prompt("Enter your initials for edit tracking") || "").trim().toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (!initials) throw new Error("Initials are required to edit.");
  const accessCode = window.prompt("Enter the Command Center access code") || "";
  if (!accessCode.trim()) throw new Error("Access code is required to edit.");

  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "authorize", initials, accessCode })
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.ok === false || !data.token) throw new Error(data.error || "Access code was not accepted.");
  const auth = { token: data.token, initials: data.initials || initials, expiresAt: data.expiresAt };
  saveAuthSession(auth);
  return auth;
}

function renderAuthStatus() {
  const button = document.getElementById("authButton");
  if (!button) return;
  if (authIsValid()) {
    button.textContent = `Edit Access: ${state.auth.initials}`;
    button.classList.add("connected");
  } else {
    button.textContent = "Edit Access";
    button.classList.remove("connected");
  }
}

renderAuthStatus();
loadData();
</script>
</body>
</html>
