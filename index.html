<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>WPR Command Center</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #202936;
    --muted: #657184;
    --border: #dfe4eb;
    --green: #18794e;
    --green-bg: #e9f7ef;
    --amber: #9b6500;
    --amber-bg: #fff4d8;
    --red: #bf2f2f;
    --red-bg: #fde9e9;
    --blue: #245fc8;
    --blue-bg: #e9f0ff;
    --shadow: 0 1px 2px rgba(17, 24, 39, .06), 0 8px 24px rgba(17, 24, 39, .06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(255, 255, 255, .96);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }

  .topbar {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) minmax(220px, 360px);
    gap: 16px;
    align-items: center;
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 22px;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.2;
  }

  .subtitle {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }

  .search {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text);
    background: #fbfcfd;
  }

  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 22px 48px;
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .updated {
    color: var(--muted);
    font-size: 12px;
  }

  .status-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .auth-button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }

  .auth-button.connected {
    border-color: #b8dec8;
    background: var(--green-bg);
    color: var(--green);
  }

  .settings-panel {
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 12px;
    box-shadow: var(--shadow);
  }

  .settings-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(260px, .7fr);
    gap: 14px;
    align-items: start;
  }

  .settings-title {
    margin: 0 0 4px;
    font-size: 14px;
    font-weight: 850;
  }

  .settings-copy {
    margin: 0 0 4px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
  }

  .recipient-list {
    display: grid;
    gap: 7px;
    margin-top: 10px;
  }

  .recipient-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    border: 1px solid #edf0f4;
    border-radius: 8px;
    background: #fbfcfd;
    padding: 8px;
  }

  .recipient-email {
    min-width: 0;
    font-size: 12px;
    font-weight: 750;
    overflow-wrap: anywhere;
  }

  .email-activity {
    display: grid;
    gap: 6px;
    margin-top: 12px;
  }

  .email-activity-row {
    border: 1px solid #edf0f4;
    border-radius: 8px;
    background: #fbfcfd;
    padding: 8px;
  }

  .email-activity-row.sent {
    border-color: #b8dec8;
    background: var(--green-bg);
  }

  .email-activity-row.failed {
    border-color: #f0b8b8;
    background: var(--red-bg);
  }

  .email-activity-title {
    font-size: 12px;
    font-weight: 800;
    overflow-wrap: anywhere;
  }

  .settings-form {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
  }

  .settings-form input {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 8px;
  }

  .sync-banner {
    border: 1px solid #f3d9a3;
    border-radius: 8px;
    background: var(--amber-bg);
    color: var(--amber);
    padding: 9px 12px;
    font-size: 12px;
    font-weight: 650;
    margin-bottom: 14px;
  }

  .sync-banner.error {
    border-color: #f0b8b8;
    background: var(--red-bg);
    color: var(--red);
  }

  .edit-note {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .chip {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .chip.active {
    background: var(--text);
    border-color: var(--text);
    color: #fff;
  }

  .kpis {
    display: grid;
    grid-template-columns: repeat(5, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }

  .kpi {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    box-shadow: var(--shadow);
  }

  .kpi strong {
    display: block;
    font-size: 24px;
    line-height: 1;
  }

  .kpi span {
    display: block;
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 650;
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 22px 0 10px;
  }

  .section-head h2 {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .count {
    color: var(--muted);
    font-size: 12px;
  }

  .section-title-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .attention-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .section-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .text-button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 7px;
    padding: 6px 9px;
    font-size: 12px;
    font-weight: 750;
    cursor: pointer;
  }

  .text-button:hover {
    border-color: #c9d1dc;
  }

  .attention-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--amber);
    border-radius: 8px;
    padding: 12px;
    box-shadow: var(--shadow);
  }

  .attention-card.red { border-left-color: var(--red); }
  .attention-card.green { border-left-color: var(--green); }

  .attention-label {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .03em;
  }

  .attention-title {
    margin-top: 7px;
    font-size: 14px;
    font-weight: 750;
    line-height: 1.3;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  .attention-meta {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
  }

  .project-list {
    display: grid;
    gap: 7px;
  }

  .project-template {
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    padding: 12px;
    box-shadow: var(--shadow);
  }

  .template-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 9px;
  }

  .template-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }

  .timeline-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    box-shadow: var(--shadow);
    overflow-x: auto;
  }

  .timeline-grid {
    min-width: 680px;
  }

  .timeline-row {
    display: grid;
    grid-template-columns: 170px 1fr;
    gap: 10px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #edf0f4;
  }

  .timeline-row:last-child {
    border-bottom: 0;
  }

  .timeline-months {
    display: grid;
    grid-template-columns: 170px 1fr;
    gap: 10px;
    margin-bottom: 3px;
  }

  .month-track {
    position: relative;
    height: 18px;
  }

  .month-label {
    position: absolute;
    top: 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 750;
  }

  .timeline-name {
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .timeline-track {
    position: relative;
    height: 20px;
    border-radius: 5px;
    background: #f1f4f7;
  }

  .timeline-bar {
    position: absolute;
    top: 4px;
    height: 12px;
    min-width: 5px;
    border-radius: 4px;
  }

  .timeline-bar.prewire { background: #14b8a6; }
  .timeline-bar.trim { background: #fb923c; }
  .timeline-bar.handover { background: #7c5cff; }
  .timeline-bar.install { background: var(--blue); }
  .timeline-today {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background: #111827;
    opacity: .38;
  }

  .timeline-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
  }

  .legend-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }

  .legend-dot.prewire { background: #14b8a6; }
  .legend-dot.trim { background: #fb923c; }
  .legend-dot.handover { background: #7c5cff; }
  .legend-dot.install { background: var(--blue); }

  .project-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .project-card.has-signal {
    border-left: 3px solid var(--amber);
  }

  .project-card.has-signal.red {
    border-left-color: var(--red);
  }

  .project-summary {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 10px;
    align-items: center;
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 0;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }

  .project-summary:hover {
    background: #fbfcfd;
  }

  .project-title {
    font-size: 14px;
    font-weight: 800;
    line-height: 1.25;
  }

  .project-sub {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }

  .health {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: max-content;
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 800;
  }

  .health.compact {
    padding: 4px 8px;
    font-size: 11px;
  }

  .health::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .health.green { background: var(--green-bg); color: var(--green); }
  .health.amber { background: var(--amber-bg); color: var(--amber); }
  .health.red { background: var(--red-bg); color: var(--red); }
  .health.pending { background: #eef1f5; color: var(--muted); }

  .metric {
    min-width: 0;
  }

  .metric strong {
    display: block;
    font-size: 18px;
  }

  .metric span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
  }

  .metric-strip {
    display: grid;
    grid-template-columns: repeat(4, minmax(44px, 1fr));
    gap: 6px;
  }

  .metric-strip .metric {
    border: 1px solid #edf0f4;
    border-radius: 7px;
    padding: 7px 8px;
    background: #fbfcfd;
  }

  .metric.open-metric {
    display: grid;
    grid-template-columns: minmax(28px, 1fr) auto;
    grid-template-rows: auto auto;
    align-items: center;
    column-gap: 8px;
  }

  .open-source-breakdown {
    grid-column: 2;
    grid-row: 1 / 3;
    display: grid;
    align-content: center;
    gap: 2px;
    width: 50px;
    border: 1px solid #e2e7ee;
    border-radius: 6px;
    padding: 4px 5px;
    background: #fff;
    color: var(--muted);
    font-size: 8.5px;
    font-weight: 850;
    line-height: 1;
    white-space: nowrap;
  }

  .metric .open-source-breakdown span {
    display: initial;
    margin-top: 0;
    color: inherit;
    font-size: inherit;
    font-weight: inherit;
  }

  .open-source-row {
    display: grid;
    grid-template-columns: 13px minmax(0, 1fr);
    align-items: baseline;
    gap: 4px;
  }

  .open-source-count {
    color: var(--text);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .open-source-label {
    min-width: 0;
    overflow: hidden;
    text-align: left;
  }

  .expand-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--muted);
    border-radius: 7px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  .expand-button[aria-expanded="true"] {
    color: var(--blue);
    border-color: #cbd9fb;
    background: var(--blue-bg);
  }

  .project-file {
    border-top: 1px solid #edf0f4;
    padding: 12px;
    display: grid;
    grid-template-columns: minmax(160px, .65fr) minmax(220px, 1fr);
    gap: 12px;
    background: #fff;
  }

  .project-file[hidden] {
    display: none;
  }

  .file-panel {
    border: 1px solid #edf0f4;
    border-radius: 8px;
    padding: 10px;
    background: #fbfcfd;
  }

  .timeline-edit-grid {
    display: grid;
    gap: 8px;
  }

  .timeline-edit-row {
    display: grid;
    grid-template-columns: minmax(92px, .8fr) minmax(110px, 1fr) minmax(110px, 1fr) auto;
    align-items: end;
    gap: 8px;
  }

  .timeline-phase-label {
    align-self: center;
    min-width: 0;
    font-size: 12px;
    font-weight: 800;
    overflow-wrap: anywhere;
  }

  .timeline-complete-field {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
    padding-bottom: 1px;
  }

  .timeline-complete-field input {
    width: 17px;
    height: 17px;
    accent-color: var(--blue);
  }

  .timeline-readonly-list {
    display: grid;
    gap: 7px;
  }

  .timeline-readonly-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    border: 1px solid #edf0f4;
    border-radius: 7px;
    padding: 7px 8px;
    background: #fff;
    font-size: 12px;
  }

  .approval-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
  }

  .approval-metric {
    border: 1px solid #edf0f4;
    border-radius: 7px;
    padding: 7px 8px;
    background: #fff;
    min-width: 0;
  }

  .approval-metric strong {
    display: block;
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .approval-metric span {
    display: block;
    margin-bottom: 3px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .approval-metric.good strong { color: var(--green); }
  .approval-metric.watch strong { color: var(--amber); }
  .approval-metric.bad strong { color: var(--red); }

  .file-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .links {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 9px;
  }

  .links a {
    color: var(--blue);
    background: var(--blue-bg);
    border: 1px solid #cbd9fb;
    border-radius: 6px;
    padding: 4px 7px;
    font-size: 11px;
    font-weight: 750;
    text-decoration: none;
  }

  .compact-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .compact-field label {
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .compact-field input,
  .compact-field select,
  .compact-field textarea,
  .project-template input,
  .project-template select,
  .task-input,
  .add-task-row textarea {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 7px 8px;
  }

  .compact-field textarea,
  .add-task-row textarea {
    min-height: 44px;
    resize: vertical;
  }

  .control-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .control-grid .full {
    grid-column: 1 / -1;
  }

  .close-project-panel {
    display: flex;
    justify-content: flex-end;
    background: #fbfcfd;
  }

  .close-project-actions {
    display: grid;
    gap: 9px;
  }

  .close-project-warning {
    border-color: #f0b8b8;
    background: var(--red-bg);
  }

  .close-project-warning .close-project-actions {
    justify-items: start;
  }

  .close-confirm-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .confirm-close {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr);
    gap: 8px;
    align-items: start;
    color: var(--red);
    font-size: 12px;
    font-weight: 750;
    line-height: 1.35;
  }

  .confirm-close input {
    margin-top: 1px;
  }

  .task-list {
    display: grid;
    gap: 7px;
  }

  .task-group {
    display: grid;
    gap: 7px;
  }

  .task-group + .task-group {
    margin-top: 7px;
  }

  .task-group-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: 850;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .closed-task-section {
    margin-top: 16px;
    padding: 12px;
    border: 1px solid #dfe4eb;
    border-radius: 8px;
    background: #f4f6f8;
  }

  .closed-task-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    border: 0;
    background: transparent;
    color: #6b7280;
    padding: 0;
    font: inherit;
    cursor: pointer;
    text-align: left;
  }

  .closed-task-toggle .task-group-title {
    color: #6b7280;
    margin: 0;
  }

  .closed-task-toggle-count {
    color: var(--muted);
    font-size: 11px;
    font-weight: 750;
    white-space: nowrap;
  }

  .closed-task-content {
    margin-top: 10px;
  }

  .task-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 116px;
    gap: 8px;
    align-items: start;
    border: 1px solid #edf0f4;
    border-radius: 8px;
    background: #fff;
    padding: 8px;
  }

  .task-row.todo-item {
    border-left: 4px solid #d8ad54;
    background: #fffaf0;
  }

  .task-row.note-item {
    border-left: 4px solid #a9c3fb;
    background: #f4f8ff;
  }

  .task-row.todo-item .task-title {
    color: #4f3b16;
  }

  .task-row.note-item .task-title {
    color: #254d86;
  }

  .task-row.closed {
    border-color: #dfe4eb;
    border-left-color: #c8d0da;
    background: #eef1f5;
    color: var(--muted);
  }

  .task-row.closed .task-title {
    color: #6b7280;
  }

  .task-row.closed .task-meta {
    color: #8a94a3;
  }

  .task-title {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .task-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
  }

  .source-link {
    color: var(--blue);
    text-decoration: none;
  }

  .source-chip {
    display: inline-flex;
    align-items: center;
    width: max-content;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 10.5px;
    font-weight: 850;
    line-height: 1.2;
    text-decoration: none;
  }

  .source-chip.pulse {
    background: #f0f6ff;
    border-color: #b9d5ff;
    color: #0b63ce;
  }

  .source-chip.procore {
    background: #fff3e6;
    border-color: #ffc98a;
    color: #c45f00;
  }

  .source-chip.closed {
    background: #e8ecf1;
    border-color: #d1d8e0;
    color: #7b8492;
  }

  .source-chip.command,
  .source-chip.other {
    background: #f4f6f8;
    border-color: var(--border);
    color: var(--muted);
  }

  .state-chip {
    display: inline-flex;
    align-items: center;
    width: max-content;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 7px;
    background: #fff;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 850;
    line-height: 1.2;
  }

  .state-chip.todo,
  .state-chip.initiated {
    border-color: #f0d49a;
    background: var(--amber-bg);
    color: var(--amber);
  }

  .state-chip.note,
  .state-chip.ready-for-review {
    border-color: #cbd9fb;
    background: var(--blue-bg);
    color: var(--blue);
  }

  .state-chip.done,
  .state-chip.closed {
    border-color: #d5dbe3;
    background: #eef1f5;
    color: #6b7280;
  }

  .add-task-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 118px auto;
    gap: 8px;
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px dashed var(--border);
  }

  .primary-button {
    border: 0;
    border-radius: 7px;
    background: var(--blue);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    padding: 8px 12px;
    cursor: pointer;
  }

  .secondary-button {
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    font-size: 12px;
    font-weight: 800;
    padding: 8px 12px;
    cursor: pointer;
  }

  .danger-button {
    width: max-content;
    border: 1px solid #e3a1a1;
    border-radius: 7px;
    background: #fff;
    color: var(--red);
    font-size: 12px;
    font-weight: 850;
    padding: 8px 12px;
    cursor: pointer;
  }

  .primary-button:disabled,
  .secondary-button:disabled,
  .danger-button:disabled,
  .task-input:disabled,
  .control-input:disabled,
  .timeline-input:disabled {
    opacity: .65;
    cursor: default;
  }

  .task-status-input.todo {
    border-color: #d8ad54;
    background: var(--amber-bg);
    color: var(--amber);
    font-weight: 850;
  }

  .task-status-input.note {
    border-color: #a9c3fb;
    background: var(--blue-bg);
    color: var(--blue);
    font-weight: 850;
  }

  .task-status-input.done {
    border-color: #c8d0da;
    background: #eef1f5;
    color: #6b7280;
    font-weight: 850;
  }

  .project-signal {
    display: block;
  }

  .project-file .project-signal {
    grid-column: 1 / -1;
  }

  .signal-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .signal-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 7px;
  }

  .signal-pill {
    display: grid;
    grid-template-columns: 7px minmax(0, 1fr);
    align-items: start;
    gap: 6px;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    background: #fff;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    line-height: 1.35;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  .signal-pill.more {
    background: #f5f7fa;
    color: var(--muted);
    grid-template-columns: 1fr;
  }

  .signal-pill.more::before {
    display: none;
  }

  .signal-pill::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    flex: 0 0 auto;
  }

  .signal-pill.red {
    background: var(--red-bg);
    border-color: #f3c5c5;
    color: var(--red);
  }

  .signal-pill.red::before {
    background: var(--red);
  }

  .signal-pill.amber {
    background: var(--amber-bg);
    border-color: #efd28f;
    color: var(--amber);
  }

  .empty {
    border: 1px dashed var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 18px;
    color: var(--muted);
    font-size: 14px;
  }

  @media (max-width: 980px) {
    .topbar {
      grid-template-columns: 1fr;
    }

    .metric-strip {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .project-file {
      grid-template-columns: 1fr;
    }

    .timeline-edit-row {
      grid-template-columns: minmax(96px, .7fr) minmax(110px, 1fr) minmax(110px, 1fr) auto;
    }

    .template-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .kpis {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .attention-list {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 520px) {
    .topbar,
    main {
      padding-left: 14px;
      padding-right: 14px;
    }

    .kpis {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .kpi {
      padding: 10px;
    }

    .kpi strong {
      font-size: 20px;
    }

    .status-row {
      margin-bottom: 10px;
    }

    .section-head {
      align-items: flex-start;
      flex-direction: column;
    }

    .template-grid {
      grid-template-columns: 1fr;
    }

    .filters {
      flex-wrap: nowrap;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 3px;
    }

    .chip {
      white-space: nowrap;
    }

    .metric-strip {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .timeline-edit-row {
      grid-template-columns: 1fr 1fr auto;
    }

    .timeline-phase-label {
      grid-column: 1 / -1;
    }

    .project-signal {
      gap: 7px;
    }

    .signal-list {
      flex-direction: column;
    }

    .signal-pill {
      border-radius: 7px;
      align-items: flex-start;
    }

    .settings-grid {
      grid-template-columns: 1fr;
    }

    .settings-form {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div>
      <h1>WPR Command Center</h1>
      <div class="subtitle">Shared project signal view for field teams</div>
    </div>
    <input class="search" id="searchInput" type="search" placeholder="Search project, area, team, phase">
  </div>
</header>

<main>
  <div class="sync-banner" id="syncBanner" style="display:none;"></div>
  <div class="status-row">
    <div class="updated" id="updatedText">Loading project data...</div>
    <div class="status-actions">
      <button class="auth-button" id="authButton" type="button">Edit Access</button>
      <button class="auth-button" id="settingsButton" type="button">Settings</button>
      <div class="filters" id="filters"></div>
    </div>
  </div>
  <section id="settingsPanel"></section>

  <section class="kpis" id="kpis"></section>

  <section>
    <div class="section-head">
      <h2>Attention Needed</h2>
      <div class="count" id="attentionCount"></div>
    </div>
    <div class="attention-list" id="attentionList"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>Schedule Timeline</h2>
      <div class="count" id="timelineCount"></div>
    </div>
    <div class="timeline-wrap">
      <div class="timeline-grid">
        <div class="timeline-months">
          <div></div>
          <div class="month-track" id="timelineMonths"></div>
        </div>
        <div id="timelineRows"></div>
      </div>
      <div class="timeline-legend">
        <span><span class="legend-dot prewire"></span>Pre-Wire</span>
        <span><span class="legend-dot trim"></span>Trim</span>
        <span><span class="legend-dot handover"></span>WPR Handover</span>
        <span><span class="legend-dot install"></span>Install</span>
      </div>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Projects</h2>
      <div class="section-title-actions">
        <button class="secondary-button" id="addProjectToggle" type="button">Add Project</button>
        <div class="count" id="projectCount"></div>
      </div>
    </div>
    <div id="projectTemplate"></div>
    <div class="project-list" id="projectList"></div>
  </section>
</main>

<script>
const AUTH_STORAGE_KEY = "wprCommandCenterAuth";

const state = {
  projects: [],
  filter: "all",
  query: "",
  attentionExpanded: false,
  addProjectOpen: false,
  expandedProjects: new Set(),
  expandedClosedItems: new Set(),
  closingProjects: new Set(),
  settingsOpen: false,
  settings: { notifications: { recipients: [], emailConfigured: false } },
  saving: false,
  live: false,
  auth: loadAuthSession()
};

const API_URL = "https://wpr-command-center-api.wpr-command-center.workers.dev";
const SYNC_ENABLED = API_URL.indexOf("http") === 0;
const COLLAPSED_ATTENTION_LIMIT = 6;
const PULSE_PROJECTS_URL = "https://www.pulsecentral.ai/c/ati-of-america/projects";
const PROCORE_URL = "https://app.procore.com/";
const CLOSE_PROJECT_CONFIRMATION = "Are you sure you want to close this project? After this action you will no longer be able to access any data stored within the Command Center";
const TIMELINE_PHASE_ORDER = ["prewire", "trim", "handover", "install"];

const healthLabels = {
  green: "On Track",
  amber: "At Risk",
  red: "Needs Help",
  pending: "Not Started"
};

const fallbackData = {
  lastUpdated: "2026-07-27T09:00:00-06:00",
  source: "fallback",
  projects: []
};

async function loadData() {
  if (SYNC_ENABLED) {
    try {
      const response = await fetch(API_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(`Live API unavailable (${response.status})`);
      const data = await response.json();
      const projects = Array.isArray(data) ? data : data.data;
      if (!Array.isArray(projects)) throw new Error("Live API returned no project list");
      state.projects = normalizeProjects(projects);
      state.settings = normalizeSettings(data.settings);
      state.live = true;
      document.getElementById("updatedText").textContent = "Live Command Center data";
      showSyncBanner("none");
      render();
      renderAuthStatus();
      return;
    } catch (error) {
      console.error("Live API load failed:", error);
      state.live = false;
      showSyncBanner("error", "Live editing is unavailable right now. Showing the latest hosted snapshot.");
    }
  }

  try {
    const response = await fetch("data/projects.json", { cache: "no-store" });
    if (!response.ok) throw new Error("Data file unavailable");
    const data = await response.json();
    state.projects = normalizeProjects(data.projects);
    document.getElementById("updatedText").textContent = `Last updated ${formatDateTime(data.lastUpdated)} from ${data.source || "Command Center"}`;
  } catch (error) {
    state.projects = normalizeProjects(fallbackData.projects);
    state.settings = normalizeSettings();
    document.getElementById("updatedText").textContent = "Project data could not be loaded.";
  }
  render();
}

function showSyncBanner(kind, message = "") {
  const banner = document.getElementById("syncBanner");
  if (kind === "none") {
    banner.style.display = "none";
    banner.textContent = "";
    return;
  }
  banner.style.display = "block";
  banner.classList.toggle("error", kind === "error");
  banner.textContent = message;
}

async function postUpdate(action, payload) {
  if (!state.live || !SYNC_ENABLED) throw new Error("Live editing is not connected.");
  const auth = await ensureEditAccess();
  state.saving = true;
  renderProjects();
  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-command-center-session": auth.token,
        "x-command-center-initials": auth.initials
      },
      body: JSON.stringify({ action, ...payload })
    });
    if (response.status === 401) {
      clearAuthSession();
      renderAuthStatus();
      throw new Error("Edit access expired. Please reconnect edit access.");
    }
    const responseText = await response.text();
    let data = {};
    try {
      data = responseText ? JSON.parse(responseText) : {};
    } catch {
      data = {};
    }
    if (!response.ok || data.ok === false) throw new Error(data.error || `Save failed (${response.status})`);
    const projects = Array.isArray(data) ? data : data.data;
    if (Array.isArray(projects)) state.projects = normalizeProjects(projects);
    state.settings = normalizeSettings(data.settings);
    showSyncBanner("none");
  } finally {
    state.saving = false;
    render();
  }
}

function normalizeProjects(projects) {
  return Array.isArray(projects) ? projects.filter(isDashboardProject).map(project => ({
    id: project.id || project.name,
    name: project.name || "Untitled project",
    area: project.area || project.segment || project.projectGroup || "Unassigned",
    team: project.team || project.externalTeam || "No team listed",
    health: normalizeHealth(project.health || project.rag),
    phase: project.phase || currentProjectPhase(project.timelines) || "Not scheduled",
    startDate: project.startDate || project.startsAt || null,
    endDate: project.endDate || project.endsAt || null,
    openTasks: Number(project.openTasks) || openTaskCount(project),
    overdueTasks: Number(project.overdueTasks) || 0,
    highPriorityTasks: Number(project.highPriorityTasks) || 0,
    risks: Number(project.risks) || (Array.isArray(project.risks) ? project.risks.length : 0),
    nextHandoff: project.nextHandoff || null,
    approvalsPayments: normalizeApprovalsPayments(project.approvalsPayments, project.control),
    control: normalizeControl(project.control, project.id),
    taskList: normalizeTaskList(project.taskList),
    openSourceCounts: openSourceCounts(project.taskList),
    attention: Array.isArray(project.attention) ? project.attention : [],
    links: Array.isArray(project.links) ? project.links : [],
    timelines: normalizeTimelines(project.timelines)
  })) : [];
}

function normalizeTimelines(timelines) {
  return (Array.isArray(timelines) ? timelines : [])
    .map(item => ({
      key: item.key || "",
      label: item.label || "",
      start: item.start || null,
      end: item.end || null,
      status: item.status || ""
    }))
    .sort((a, b) => timelinePhaseIndex(a.key) - timelinePhaseIndex(b.key));
}

function timelinePhaseIndex(key) {
  const index = TIMELINE_PHASE_ORDER.indexOf(key);
  return index === -1 ? TIMELINE_PHASE_ORDER.length : index;
}

function normalizeSettings(settings = {}) {
  const notifications = settings.notifications && typeof settings.notifications === "object" ? settings.notifications : {};
  const recipients = Array.isArray(notifications.recipients) ? notifications.recipients : [];
  return {
    notifications: {
      recipients: recipients.map(item => ({
        email: String(item.email || "").trim(),
        createdBy: String(item.createdBy || "").trim(),
        createdAt: String(item.createdAt || "").trim()
      })).filter(item => item.email),
      emailConfigured: notifications.emailConfigured === true,
      recent: Array.isArray(notifications.recent) ? notifications.recent.map(item => ({
        createdAt: String(item.createdAt || "").trim(),
        status: String(item.status || "").trim(),
        subject: String(item.subject || "").trim(),
        recipientCount: Number(item.recipientCount) || 0,
        providerId: String(item.providerId || "").trim(),
        error: String(item.error || "").trim()
      })) : []
    }
  };
}

function normalizeHealth(value) {
  return ["green", "amber", "red", "pending"].includes(value) ? value : "pending";
}

function normalizeApprovalsPayments(value, control = {}) {
  const incoming = value && typeof value === "object" ? value : {};
  const source = control && typeof control === "object" ? control : {};
  return {
    contract: String(incoming.contract || source.contractStatus || "").trim(),
    deposit: String(incoming.deposit || source.depositStatus || "").trim(),
    changeOrders: String(incoming.changeOrders || source.changeOrderStatus || "").trim()
  };
}

function normalizeControl(value, projectId) {
  const incoming = value && typeof value === "object" ? value : {};
  return {
    projectId,
    operatingState: ["Action Needed", "Follow-Up Needed", "Monitor", "Stable"].includes(incoming.operatingState) ? incoming.operatingState : "Stable",
    nextOutcome: String(incoming.nextOutcome || "").trim(),
    nextMoveOwner: String(incoming.nextMoveOwner || "").trim(),
    nextAction: String(incoming.nextAction || "").trim(),
    reviewDate: dateOnly(incoming.reviewDate) || "",
    responseDate: dateOnly(incoming.responseDate) || "",
    blocked: incoming.blocked === true || incoming.blocked === "true" || incoming.blocked === "TRUE",
    blockerReason: String(incoming.blockerReason || "").trim(),
    contractStatus: String(incoming.contractStatus || "").trim(),
    depositStatus: String(incoming.depositStatus || "").trim(),
    changeOrderStatus: String(incoming.changeOrderStatus || "").trim(),
    updatedBy: String(incoming.updatedBy || "").trim(),
    updatedAt: String(incoming.updatedAt || "").trim()
  };
}

function normalizeTaskList(tasks) {
  return Array.isArray(tasks) ? tasks.map(task => ({
    id: task.id,
    name: String(task.name || "").trim(),
    status: ["todo", "note", "done"].includes(task.status) ? task.status : task.status === "progress" ? "note" : "todo",
    source: String(task.source || "").trim(),
    sourceState: String(task.sourceState || task.source_state || "").trim(),
    externalUrl: String(task.externalUrl || task.url || task.link || "").trim(),
    updatedBy: String(task.updatedBy || "").trim(),
    updatedAt: String(task.updatedAt || "").trim()
  }))
    .filter(task => task.name)
    .sort((a, b) => taskSourceRank(a.source) - taskSourceRank(b.source) || a.name.localeCompare(b.name)) : [];
}

function openTaskCount(project) {
  return normalizeTaskList(project.taskList).filter(task => task.status !== "done").length;
}

function openSourceCounts(tasks) {
  return normalizeTaskList(tasks)
    .filter(task => task.status !== "done")
    .reduce((counts, task) => {
      const group = taskSourceGroup(task.source);
      counts[group] = (counts[group] || 0) + 1;
      return counts;
    }, { procore: 0, pulse: 0, command: 0, other: 0 });
}

function currentProjectPhase(timelines = []) {
  const open = (Array.isArray(timelines) ? timelines : []).find(item => item && item.status !== "complete");
  return open ? open.label : "";
}

function isDashboardProject(project) {
  const name = String(project && project.name || "").trim();
  const area = String(project && (project.area || project.segment || project.projectGroup) || "").trim();
  const team = String(project && (project.team || project.externalTeam) || "").trim();
  return !(
    name === "Procore Observation Review" ||
    area === "Unmapped Procore" ||
    (team === "Procore" && area === "Unmapped Procore")
  );
}

function render() {
  renderFilters();
  renderSettings();
  renderKpis();
  renderAttention();
  renderTimeline();
  renderProjectTemplate();
  renderProjects();
}

function renderSettings() {
  const panel = document.getElementById("settingsPanel");
  const button = document.getElementById("settingsButton");
  if (button) button.classList.toggle("connected", state.settingsOpen);
  if (!panel) return;
  if (!state.settingsOpen) {
    panel.innerHTML = "";
    return;
  }

  const recipients = state.settings.notifications.recipients;
  const configured = state.settings.notifications.emailConfigured;
  const recent = state.settings.notifications.recent;
  panel.innerHTML = `
    <div class="settings-panel">
      <div class="settings-grid">
        <div>
          <h2 class="settings-title">Notifications</h2>
          <p class="settings-copy">New Command Center To-Dos and Notes will send an email to the recipients listed here.</p>
          <p class="settings-copy">${configured ? "Email sending is connected." : "Email sending needs the Resend key and sending address before messages can go out."}</p>
          <div class="recipient-list">
            ${recipients.length ? recipients.map(item => `
              <div class="recipient-row">
                <div>
                  <div class="recipient-email">${escapeHtml(item.email)}</div>
                  ${item.createdBy ? `<div class="edit-note">Added ${escapeHtml(item.createdBy)}${item.createdAt ? ` · ${formatDateTime(item.createdAt)}` : ""}</div>` : ""}
                </div>
                <button class="secondary-button remove-recipient-button" type="button" data-email="${escapeAttribute(item.email)}" ${state.saving ? "disabled" : ""}>Remove</button>
              </div>
            `).join("") : `<div class="empty">No notification recipients have been added yet.</div>`}
          </div>
          <div class="email-activity">
            <h2 class="settings-title">Recent Email Activity</h2>
            ${recent.length ? recent.map(item => `
              <div class="email-activity-row ${escapeAttribute(item.status)}">
                <div class="email-activity-title">${escapeHtml(item.status === "sent" ? "Sent" : item.status === "failed" ? "Failed" : "Skipped")}: ${escapeHtml(item.subject || "Notification")}</div>
                <div class="edit-note">${item.createdAt ? escapeHtml(formatDateTime(item.createdAt)) : "Time unknown"} · ${item.recipientCount} recipient${item.recipientCount === 1 ? "" : "s"}${item.providerId ? ` · ${escapeHtml(item.providerId)}` : ""}</div>
                ${item.error ? `<div class="edit-note">${escapeHtml(item.error)}</div>` : ""}
              </div>
            `).join("") : `<div class="empty">No email attempts have been recorded yet.</div>`}
          </div>
        </div>
        <div>
          <h2 class="settings-title">Add Recipient</h2>
          <div class="settings-form">
            <input id="notificationEmailInput" type="email" placeholder="name@example.com" ${state.saving ? "disabled" : ""}>
            <button class="primary-button" id="addRecipientButton" type="button" ${state.saving ? "disabled" : ""}>Add</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function visibleProjects() {
  const query = state.query.trim().toLowerCase();
  return state.projects.filter(project => {
    if (state.filter !== "all" && project.health !== state.filter) return false;
    if (!query) return true;
    return [
      project.name,
      project.area,
      project.team,
      project.phase,
      project.approvalsPayments.contract,
      project.approvalsPayments.deposit,
      project.approvalsPayments.changeOrders,
      project.control.nextOutcome,

function renderTimelineRow(project, range) {
  const bars = project.timelines
    .map(item => {
      const seg = timelineSegment(item.start, item.end, range.min, range.max);
      if (!seg) return "";
      return `<div class="timeline-bar ${escapeHtml(item.key)}" style="left:${seg.left}%;width:${seg.width}%" title="${escapeAttribute(project.name)} - ${escapeAttribute(item.label)}: ${escapeAttribute(formatDateRange(item.start, item.end))}"></div>`;
    })
    .join("");
  const today = timelineToday(range);
  return `
    <div class="timeline-row">
      <div class="timeline-name">${escapeHtml(project.name)}</div>
      <div class="timeline-track">
        ${today === null ? "" : `<div class="timeline-today" style="left:${today}%"></div>`}
        ${bars || `<span class="project-sub" style="position:absolute;left:7px;top:3px;">Not scheduled</span>`}
      </div>
    </div>
  `;
}

function renderMonthLabels(range) {
  const labels = [];
  const start = new Date(range.min.getFullYear(), range.min.getMonth(), 1);
  for (let cursor = start; cursor <= range.max; cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1)) {
    labels.push(`<span class="month-label" style="left:${((cursor - range.min) / (range.max - range.min)) * 100}%">${cursor.toLocaleDateString("en-US", { month: "short" })}</span>`);
  }
  return labels.join("");
}

function getTimelineRange() {
  const now = new Date();
  return {
    min: new Date(now.getFullYear(), now.getMonth(), 1),
    max: new Date(now.getFullYear(), now.getMonth() + 3, 0)
  };
}

function timelineSegment(start, end, min, max) {
  const startDate = parseDate(start);
  const endDate = parseDate(end);
  if (!startDate || !endDate || endDate < min || startDate > max) return null;
  const total = max - min;
  const clippedStart = startDate < min ? min : startDate;
  const clippedEnd = endDate > max ? max : endDate;
  return {
    left: Math.max(0, ((clippedStart - min) / total) * 100),
    width: Math.max(1.5, ((clippedEnd - clippedStart) / total) * 100)
  };
}

function timelineToday(range) {
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  if (now < range.min || now > range.max) return null;
  return ((now - range.min) / (range.max - range.min)) * 100;
}

}

function renderTaskMeta(task, closed) {
  return task.source ? renderTaskSource(task, closed) : "Command Center";
}

function renderTaskStateControl(task) {
  if (state.live && isManualTask(task)) {
    return `
      <select class="task-input task-status-input ${escapeAttribute(task.status)}" data-task-id="${escapeAttribute(task.id)}" data-field="status" ${state.saving ? "disabled" : ""}>
        <option value="todo" ${task.status === "todo" ? "selected" : ""}>To-Do</option>
        <option value="note" ${task.status === "note" ? "selected" : ""}>Note</option>
        <option value="done" ${task.status === "done" ? "selected" : ""}>Close</option>
      </select>
    `;
  }
  return renderStateChip(sourceStateLabel(task), sourceStateClass(task));
}

function groupedTasks(tasks) {
  const groups = [
    { key: "procore", label: "Procore", tasks: [] },
    { key: "pulse", label: "Pulse", tasks: [] },
    { key: "command", label: "Command Center", tasks: [] },
    { key: "other", label: "Other", tasks: [] }
  ];
  tasks.forEach(task => {
    const key = taskSourceGroup(task.source);
    const group = groups.find(item => item.key === key) || groups[3];
    group.tasks.push(task);
  });
  return groups.filter(group => group.tasks.length);
}

function taskSourceGroup(source) {
  if (source === "procore" || source === "procore-review" || source === "Procore") return "procore";
  if (source === "pulse" || source === "Pulse") return "pulse";
  if (!source || source === "Command Center") return "command";
  return "other";
}

function taskSourceRank(source) {
  const group = taskSourceGroup(source);
  if (group === "procore") return 1;
  if (group === "pulse") return 2;
  if (group === "command") return 3;
  return 4;
}

function renderTaskSource(task, closed = false) {
  const label = taskSourceLabel(task.source);
  const className = closed ? "closed" : taskSourceGroup(task.source);
  const url = taskSourceUrl(task);
  if (url) return `<a class="source-chip ${escapeAttribute(className)}" href="${escapeAttribute(url)}" target="_blank" rel="noopener" title="${escapeAttribute(sourceLinkTitle(label, task.externalUrl))}">${escapeHtml(label)}</a>`;
  return `<span class="source-chip ${escapeAttribute(className)}">${escapeHtml(label)}</span>`;
}

function renderSourceState(task) {
  if (isManualTask(task)) return "";
  return renderStateChip(sourceStateLabel(task), sourceStateClass(task));
}

function renderStateChip(label, className) {
  return `<span class="state-chip ${escapeAttribute(className)}">${escapeHtml(label)}</span>`;
}

function sourceStateLabel(task) {
  const state = String(task.sourceState || "").trim();
  return state || taskStatusLabel(task.status);
}

function sourceStateClass(task) {
  return sourceStateLabel(task).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "todo";
}

function isManualTask(task) {
  return taskSourceGroup(task.source) === "command";
}

function taskSourceUrl(task) {
  if (task.externalUrl) return task.externalUrl;
  const group = taskSourceGroup(task.source);
  if (group === "pulse") return PULSE_PROJECTS_URL;
  if (group === "procore") return PROCORE_URL;
  return "";
}

function sourceLinkTitle(label, hasExactUrl) {
  return hasExactUrl ? `Open ${label} item` : `Open ${label}`;
}

function renderEditNote(item) {
  if (!item || !item.updatedBy) return "";
  const when = item.updatedAt ? ` · ${formatDateTime(item.updatedAt)}` : "";
  return `<div class="edit-note">Last edit ${escapeHtml(item.updatedBy)}${escapeHtml(when)}</div>`;
}

function taskSourceLabel(source) {
  if (source === "pulse") return "Pulse";
  if (source === "procore" || source === "procore-review") return "Procore";
  return source || "Command Center";
}

function taskStatusLabel(status) {
  if (status === "note") return "Note";
  if (status === "done") return "Closed";
  return "To-Do";
}

function selectField(projectId, field, label, value, options, className = "") {
  return `
    <div class="compact-field ${className}">
      <label>${escapeHtml(label)}</label>
      <select class="control-input" data-project-id="${escapeAttribute(projectId)}" data-field="${escapeAttribute(field)}" ${state.saving ? "disabled" : ""}>
        ${options.map(option => `<option value="${escapeAttribute(option)}" ${String(value || "") === option ? "selected" : ""}>${escapeHtml(option || "Not set")}</option>`).join("")}
      </select>
    </div>
  `;
}

function textField(projectId, field, label, value, className = "") {
  return `
    <div class="compact-field ${className}">
      <label>${escapeHtml(label)}</label>
      <input class="control-input" data-project-id="${escapeAttribute(projectId)}" data-field="${escapeAttribute(field)}" value="${escapeAttribute(value || "")}" ${state.saving ? "disabled" : ""}>
    </div>
  `;
}

function dateField(projectId, field, label, value, className = "") {
  return `
    <div class="compact-field ${className}">
      <label>${escapeHtml(label)}</label>
      <input type="date" class="control-input" data-project-id="${escapeAttribute(projectId)}" data-field="${escapeAttribute(field)}" value="${escapeAttribute(value || "")}" ${state.saving ? "disabled" : ""}>
    </div>
  `;
}

function timelineDateField(projectId, key, field, label, value) {
  return `
    <div class="compact-field">
      <label>${escapeHtml(label)}</label>
      <input type="date" class="timeline-input" data-project-id="${escapeAttribute(projectId)}" data-key="${escapeAttribute(key)}" data-field="${escapeAttribute(field)}" value="${escapeAttribute(value || "")}" ${state.saving ? "disabled" : ""}>
    </div>
  `;
}

function textareaField(projectId, field, label, value, className = "") {
  return `
    <div class="compact-field ${className}">
      <label>${escapeHtml(label)}</label>
      <textarea class="control-input" data-project-id="${escapeAttribute(projectId)}" data-field="${escapeAttribute(field)}" ${state.saving ? "disabled" : ""}>${escapeHtml(value || "")}</textarea>
    </div>
  `;
}

function topSeverity(items) {
  return items.some(item => item.severity === "red") ? "red" : items.some(item => item.severity === "amber") ? "amber" : "green";
}

function renderLinks(links) {
  const visibleLinks = links.filter(link => link && link.url);
  if (!visibleLinks.length) return "";
  return `<div class="links">${visibleLinks.map(link => `<a href="${escapeAttribute(link.url)}" target="_blank" rel="noopener">${escapeHtml(link.label || "Open Source")}</a>`).join("")}</div>`;
}

function sum(projects, key) {
  return projects.reduce((total, project) => total + (Number(project[key]) || 0), 0);
}

function severityScore(severity) {
  if (severity === "red") return 3;
  if (severity === "amber") return 2;
  if (severity === "green") return 1;
  return 0;
}

function formatDate(value) {
  const date = parseDate(value);
  return Number.isNaN(date.getTime()) ? "" : date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function parseDate(value) {
  if (!value) return new Date(NaN);
  return new Date(`${String(value).slice(0, 10)}T00:00:00`);
}

function formatDateTime(value) {
  if (!value) return "unknown";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "unknown" : date.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

function formatDateRange(startDate, endDate) {
  if (!startDate && !endDate) return "No date range";
  if (startDate && endDate) return `${formatDate(startDate)} to ${formatDate(endDate)}`;
  return startDate ? `Starts ${formatDate(startDate)}` : `Ends ${formatDate(endDate)}`;
}

function dateOnly(value) {
  if (!value) return "";
  const text = String(value).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(text)) return text.slice(0, 10);
  const date = parseDate(text);
  return Number.isNaN(date.getTime()) ? "" : date.toISOString().slice(0, 10);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value).replaceAll("`", "&#096;");
}

function cssEscape(value) {
  if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(String(value));
  return String(value).replace(/["\\]/g, "\\$&");
}

document.getElementById("filters").addEventListener("click", event => {
  const button = event.target.closest("[data-filter]");
  if (!button) return;
  state.filter = button.dataset.filter;
  render();
});

document.addEventListener("click", event => {
  if (event.target.closest("#attentionToggle")) {
    state.attentionExpanded = !state.attentionExpanded;
    renderAttention();
    return;
  }

  if (event.target.closest("#settingsButton")) {
    state.settingsOpen = !state.settingsOpen;
    renderSettings();
    return;
  }

  if (event.target.closest("#addRecipientButton")) {
    const email = valueFrom("notificationEmailInput");
    if (!email) {
      showSyncBanner("error", "Email address is required.");
      return;
    }
    postUpdate("addNotificationRecipient", { email }).catch(error => {
      console.error("Add notification recipient failed:", error);
      showSyncBanner("error", error.message || "Notification recipient could not be added.");
    });
    return;
  }

  const removeRecipientButton = event.target.closest(".remove-recipient-button");
  if (removeRecipientButton) {
    const email = removeRecipientButton.dataset.email;
    postUpdate("removeNotificationRecipient", { email }).catch(error => {
      console.error("Remove notification recipient failed:", error);
      showSyncBanner("error", error.message || "Notification recipient could not be removed.");
    });
    return;
  }

  const closedToggle = event.target.closest("[data-closed-toggle]");
  if (closedToggle) {
    const projectId = String(closedToggle.dataset.closedToggle);
    if (state.expandedClosedItems.has(projectId)) state.expandedClosedItems.delete(projectId);
    else state.expandedClosedItems.add(projectId);
    renderProjects();
    return;
  }

  if (event.target.closest("#addProjectToggle")) {
    if (!state.live) {
      showSyncBanner("error", "Live editing is unavailable right now. A project can only be added when the online database is connected.");
      return;
    }
    state.addProjectOpen = !state.addProjectOpen;
    renderProjectTemplate();
    return;
  }

  if (event.target.closest("#cancelProjectButton")) {
    state.addProjectOpen = false;
    renderProjectTemplate();
    return;
  }

  if (event.target.closest("#createProjectButton")) {
    const payload = readNewProjectTemplate();
    if (!payload.name) {
      showSyncBanner("error", "Project name is required.");
      return;
    }
    postUpdate("addProject", payload).then(() => {
      state.addProjectOpen = false;
      renderProjectTemplate();
    }).catch(error => {
      console.error("Add project failed:", error);
      showSyncBanner("error", error.message || "Project could not be added.");
    });
    return;
  }

  const closeProjectStart = event.target.closest(".close-project-start");
  if (closeProjectStart) {
    state.closingProjects.add(String(closeProjectStart.dataset.projectId));
    renderProjects();
    return;
  }

  const closeProjectCancel = event.target.closest(".close-project-cancel");
  if (closeProjectCancel) {
    state.closingProjects.delete(String(closeProjectCancel.dataset.projectId));
    renderProjects();
    return;
  }

  const closeProjectButton = event.target.closest(".close-project-button");
  if (closeProjectButton) {
    const projectId = closeProjectButton.dataset.projectId;
    const project = state.projects.find(item => String(item.id) === String(projectId));
    const checkbox = document.querySelector(`[data-close-confirm="${cssEscape(projectId)}"]`);
    if (!checkbox || !checkbox.checked) return;
    if (!window.confirm(CLOSE_PROJECT_CONFIRMATION)) return;
    postUpdate("closeProject", { projectId, confirmed: true, confirmationMessage: CLOSE_PROJECT_CONFIRMATION }).then(() => {
      state.expandedProjects.delete(String(projectId));
      state.closingProjects.delete(String(projectId));
      showSyncBanner("none");
    }).catch(error => {
      console.error("Close project failed:", error);
      showSyncBanner("error", error.message || `${project ? project.name : "Project"} could not be closed.`);
    });
    return;
  }

  const addTaskButton = event.target.closest(".add-task-button");
  if (addTaskButton) {
    const projectId = addTaskButton.dataset.projectId;
    const field = document.getElementById(`newTask-${projectId}`);
    const statusField = document.getElementById(`newTaskStatus-${projectId}`);
    const name = field ? field.value.trim() : "";
    const status = statusField ? statusField.value : "todo";
    if (!name) return;
    postUpdate("addTask", { projectId, name, status }).catch(error => {
      console.error("Add task failed:", error);
      showSyncBanner("error", error.message || "Task could not be added.");
    });
    return;
  }

  const projectToggle = event.target.closest("[data-project-toggle]");
  if (!projectToggle) return;
  const id = projectToggle.dataset.projectToggle;
  if (state.expandedProjects.has(id)) state.expandedProjects.delete(id);
  else state.expandedProjects.add(id);
  renderProjects();
});

document.addEventListener("change", event => {
  const closeConfirm = event.target.closest("[data-close-confirm]");
  if (closeConfirm) {
    const projectId = closeConfirm.dataset.closeConfirm;
    const button = document.querySelector(`.close-project-button[data-project-id="${cssEscape(projectId)}"]`);
    if (button) button.disabled = !closeConfirm.checked || state.saving;
    return;
  }

  const controlInput = event.target.closest(".control-input");
  if (controlInput) {
    const projectId = controlInput.dataset.projectId;
    const field = controlInput.dataset.field;
    const value = controlInput.type === "checkbox" ? controlInput.checked : controlInput.value.trim();
    postUpdate("updateProjectControl", { projectId, field, value }).catch(error => {
      console.error("Control update failed:", error);
      showSyncBanner("error", error.message || "Project control could not be saved.");
    });
    return;
  }

  const timelineInput = event.target.closest(".timeline-input");
  if (timelineInput) {
    const projectId = timelineInput.dataset.projectId;
    const key = timelineInput.dataset.key;
    const field = timelineInput.dataset.field;
    const value = field === "status" ? (timelineInput.checked ? "complete" : "") : timelineInput.value.trim();
    postUpdate("updateTimeline", { projectId, key, field, value }).catch(error => {
      console.error("Timeline update failed:", error);
      showSyncBanner("error", error.message || "Schedule could not be saved.");
    });
    return;
  }

  const taskInput = event.target.closest(".task-input");
  if (taskInput && taskInput.dataset.taskId && taskInput.dataset.field) {
    const taskId = taskInput.dataset.taskId;
    const field = taskInput.dataset.field;
    const value = taskInput.value;
    postUpdate("updateTask", { taskId, field, value }).catch(error => {
      console.error("Task update failed:", error);
      showSyncBanner("error", error.message || "Task could not be saved.");
    });
  }
});

function readNewProjectTemplate() {
  return {
    name: valueFrom("newProjectName"),
    projectGroup: valueFrom("newProjectGroup") || "Other Projects",
    segment: valueFrom("newProjectSegment"),
    externalTeam: valueFrom("newProjectTeam"),
    startsAt: valueFrom("newProjectStart"),
    endsAt: valueFrom("newProjectEnd")
  };
}

function valueFrom(id) {
  const element = document.getElementById(id);
  return element ? element.value.trim() : "";
}

document.getElementById("searchInput").addEventListener("input", event => {
  state.query = event.target.value;
  render();
});

document.getElementById("authButton").addEventListener("click", async () => {
  if (authIsValid()) {
    if (!window.confirm(`Edit access is connected as ${state.auth.initials}. Reset edit access?`)) return;
    clearAuthSession();
    renderAuthStatus();
    return;
  }
  try {
    await requestEditAccess();
    renderAuthStatus();
  } catch (error) {
    showSyncBanner("error", error.message || "Edit access could not be connected.");
  }
});

function loadAuthSession() {
  try {
    return JSON.parse(window.localStorage.getItem(AUTH_STORAGE_KEY) || "null");
  } catch {
    return null;
  }
}

function saveAuthSession(auth) {
  state.auth = auth;
  window.localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(auth));
}

function clearAuthSession() {
  state.auth = null;
  window.localStorage.removeItem(AUTH_STORAGE_KEY);
}

function authIsValid() {
  return !!(state.auth && state.auth.token && state.auth.initials && Number(state.auth.expiresAt) > Date.now());
}

async function ensureEditAccess() {
  if (authIsValid()) return state.auth;
  return requestEditAccess();
}

async function requestEditAccess() {
  const initials = (window.prompt("Enter your initials for edit tracking") || "").trim().toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (!initials) throw new Error("Initials are required to edit.");
  const accessCode = window.prompt("Enter the Command Center access code") || "";
  if (!accessCode.trim()) throw new Error("Access code is required to edit.");

  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "authorize", initials, accessCode })
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.ok === false || !data.token) throw new Error(data.error || "Access code was not accepted.");
  const auth = { token: data.token, initials: data.initials || initials, expiresAt: data.expiresAt };
  saveAuthSession(auth);
  return auth;
}

function renderAuthStatus() {
  const button = document.getElementById("authButton");
  if (!button) return;
  if (authIsValid()) {
    button.textContent = `Edit Access: ${state.auth.initials}`;
    button.classList.add("connected");
  } else {
    button.textContent = "Edit Access";
    button.classList.remove("connected");
  }
}

renderAuthStatus();
loadData();
</script>
